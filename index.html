<style>
  :root{
    --bg:#26432f;
    --bg-deep:#1c3323;
    --bg-glass:rgba(28,51,35,0.92);
    --surface:#ffffff;
    --surface-soft:#faf7ee;
    --surface-hover:#f2ecdb;
    --ink:#1f2b21;
    --ink-soft:#4c5c4e;
    --on-dark:#f7f4e8;
    --muted:#7c8a7d;
    --muted-on-dark:#c4d2c5;
    --gold:#c79a2e;
    --gold-strong:#a97f1f;
    --gold-light:#e4c05e;
    --gold-soft:rgba(199,154,46,0.16);
    --leaf:#3f6b4a;
    --leaf-soft:rgba(63,107,74,0.14);
    --danger:#b1454f;
    --danger-soft:rgba(177,69,79,0.12);
    --border:#e8e2cf;
    --border-on-dark:rgba(247,244,232,0.18);
    --radius-card:16px;
    --radius-control:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-serif:'Fraunces', serif;
    --font-mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(255,255,255,0.05), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-display);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{
    font-family:var(--font-display);
    cursor:pointer;
    border:none;
    background:none;
    color:inherit;
  }
  input,textarea,select{
    font-family:var(--font-display);
    background:var(--surface-soft);
    color:var(--ink);
    border:1px solid var(--border);
    border-radius:var(--radius-control);
    padding:10px 12px;
    font-size:15px;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  ::selection{background:var(--gold-light);color:#241505;}

  /* ---------- WATERMARK / BRAND ---------- */
  .watermark-logo{
    position:fixed;
    right:-46px;
    bottom:-46px;
    width:260px;
    max-width:38vw;
    opacity:0.07;
    pointer-events:none;
    z-index:0;
    user-select:none;
  }
  @media (max-width:600px){
    .watermark-logo{width:170px;right:-30px;bottom:-30px;}
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 24px;
    border-bottom:1px solid var(--border-on-dark);
    position:sticky;
    top:0;
    background:var(--bg-glass);
    backdrop-filter:blur(8px);
    z-index:10;
    color:var(--on-dark);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.2px;
    color:var(--on-dark);
    font-family:var(--font-serif);
  }
  .brand-logo{height:32px;width:auto;display:block;flex:none;}
  .brand .dot{color:var(--gold-light);}
  .topbar-back{
    font-size:14px;
    color:var(--muted-on-dark);
    padding:8px 10px;
    border-radius:var(--radius-control);
    white-space:nowrap;
  }
  .topbar-back:hover{color:var(--on-dark);background:rgba(255,255,255,0.08);}
  .song-title-block{flex:1;min-width:0;}
  .song-title-block h1{
    font-size:19px;
    margin:0;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-family:var(--font-serif);
    color:var(--on-dark);
  }
  .song-title-block span{
    color:var(--muted-on-dark);
    font-size:13px;
  }
  .topbar-actions{display:flex;gap:8px;flex:none;}
  .icon-btn{
    padding:8px 12px;
    border-radius:var(--radius-control);
    font-size:13px;
    color:var(--muted-on-dark);
    border:1px solid var(--border-on-dark);
    white-space:nowrap;
  }
  .icon-btn:hover{color:var(--on-dark);border-color:var(--muted-on-dark);}
  .icon-btn.danger:hover{color:#ff9ba3;border-color:#ff9ba3;}
  .icon-btn.fav-on{color:var(--gold-light);border-color:var(--gold-light);}

  .container{
    max-width:780px;
    margin:0 auto;
    padding:28px 24px 80px;
    position:relative;
    z-index:1;
  }

  .paper{
    background:var(--surface);
    border-radius:20px;
    padding:26px 26px 20px;
    box-shadow:0 18px 40px rgba(12,20,14,0.28);
  }

  /* ---------- LIST VIEW ---------- */
  .list-head{
    display:flex;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
    align-items:center;
  }
  .storage-banner{
    background:rgba(177,69,79,0.14);
    border:1px solid var(--danger);
    color:var(--on-dark);
    font-size:13px;
    line-height:1.5;
    padding:12px 14px;
    border-radius:var(--radius-control);
    margin-bottom:18px;
  }
  .search{flex:1;min-width:180px;}
  .btn-primary{
    background:var(--gold);
    color:#241505;
    font-weight:600;
    padding:10px 18px;
    border-radius:var(--radius-control);
    white-space:nowrap;
  }
  .btn-primary:hover{background:var(--gold-light);}
  .btn-secondary{
    background:rgba(255,255,255,0.08);
    color:var(--on-dark);
    font-weight:500;
    padding:10px 16px;
    border-radius:var(--radius-control);
    border:1px solid var(--border-on-dark);
    white-space:nowrap;
  }
  .btn-secondary:hover{border-color:var(--gold-light);color:var(--gold-light);}
  .list-head-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .filters-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:22px;
    align-items:center;
  }
  .filters-row select{
    min-width:150px;
    background:rgba(255,255,255,0.94);
  }
  .fav-filter-btn{
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,0.08);
    color:var(--on-dark);
    border:1px solid var(--border-on-dark);
    padding:9px 14px;
    border-radius:999px;
    font-size:13px;
    white-space:nowrap;
  }
  .fav-filter-btn:hover{border-color:var(--gold-light);}
  .fav-filter-btn.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-light);}

  .section-label{
    color:var(--on-dark);
    font-size:13px;
    letter-spacing:0.4px;
    text-transform:uppercase;
    opacity:0.75;
    margin:4px 0 12px;
  }

  .song-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:14px;
  }
  .song-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:16px;
    position:relative;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 16px rgba(12,20,14,0.10);
  }
  .song-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 12px 24px rgba(12,20,14,0.16);}
  .song-card h3{
    margin:0 0 4px;
    font-size:17px;
    padding-right:64px;
    line-height:1.3;
    font-family:var(--font-serif);
    color:var(--ink);
  }
  .song-card .artist{color:var(--muted);font-size:13px;}
  .theme-tag{
    display:inline-block;
    margin-top:9px;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color:var(--leaf);
    background:var(--leaf-soft);
    padding:3px 9px;
    border-radius:999px;
  }
  .fav-badge{
    position:absolute;
    top:12px;
    left:12px;
    color:var(--gold);
    font-size:15px;
    line-height:1;
  }
  .song-card .card-actions{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:2px;
  }
  .card-icon{
    width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
    color:var(--muted);
    font-size:14px;
  }
  .card-icon:hover{background:var(--surface-hover);color:var(--ink);}
  .card-icon.danger:hover{color:var(--danger);}

  .card-menu-wrap{position:relative;}
  .card-menu{
    position:absolute;
    top:32px;
    right:0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 14px 30px rgba(12,20,14,0.22);
    min-width:190px;
    padding:6px;
    z-index:20;
  }
  .card-menu button{
    display:block;
    width:100%;
    text-align:left;
    padding:9px 10px;
    border-radius:8px;
    font-size:13.5px;
    color:var(--ink);
  }
  .card-menu button:hover{background:var(--surface-hover);}
  .card-menu button.danger{color:var(--danger);}
  .card-menu button.danger:hover{background:var(--danger-soft);}

  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--muted-on-dark);
  }
  .empty-state .big{font-size:15px;color:var(--on-dark);margin-bottom:6px;}
</style>

<style>
  /* ---------- SHEET (view + editor share this look) ---------- */
  .sheet{overflow-x:auto;padding-bottom:8px;}
  .line{
    position:relative;
    min-width:fit-content;
    padding-top:2px;
  }
  .chords-row{
    position:relative;
    height:22px;
    font-family:var(--font-mono);
    font-size:15px;
  }
  .lyrics-row{
    font-family:var(--font-mono);
    font-size:16px;
    line-height:2.1;
    white-space:pre;
    color:var(--ink);
  }
  .chord{
    position:absolute;
    top:0;
    transform:translateX(-1px);
    background:var(--gold-soft);
    color:var(--gold-strong);
    font-weight:700;
    padding:0 5px;
    border-radius:6px;
    white-space:nowrap;
    line-height:20px;
  }
  .chord::after{
    content:"";
    position:absolute;
    left:6px;
    bottom:-4px;
    width:0;height:0;
    border-left:3px solid transparent;
    border-right:3px solid transparent;
    border-top:4px solid rgba(199,154,46,0.55);
  }
  .song-links-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding-top:16px;
    position:relative;
    z-index:1;
  }
  .link-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    color:var(--leaf);
    background:var(--leaf-soft);
    border:1px solid transparent;
    padding:6px 12px;
    border-radius:999px;
    text-decoration:none;
  }
  .link-chip:hover{border-color:var(--leaf);}

  /* ---------- VIEW PAGE ---------- */
  .autoscroll-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--bg-glass);
    backdrop-filter:blur(8px);
    border-top:1px solid var(--border-on-dark);
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    z-index:10;
  }
  .play-toggle{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.08);
    color:var(--on-dark);
    border:1px solid var(--border-on-dark);
    padding:9px 16px;
    border-radius:999px;
    font-size:14px;
    font-weight:500;
  }
  .play-toggle:hover{border-color:var(--gold-light);}
  .play-toggle.active{background:var(--gold);color:#241505;border-color:var(--gold);}
  .speed-control{display:flex;gap:10px;align-items:center;}
  .speed-label{font-size:12px;color:var(--muted-on-dark);margin-right:2px;white-space:nowrap;}
  .speed-value{font-size:12px;color:var(--on-dark);font-weight:600;width:34px;text-align:right;font-family:var(--font-mono);}
  .speed-slider{
    -webkit-appearance:none;
    appearance:none;
    width:130px;
    height:4px;
    border-radius:999px;
    background:var(--border-on-dark);
    outline:none;
  }
  .speed-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--gold);
    cursor:pointer;
    border:2px solid #241505;
  }
  .speed-slider::-moz-range-thumb{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--gold);
    cursor:pointer;
    border:2px solid #241505;
  }
  .speed-slider::-moz-range-track{
    height:4px;
    border-radius:999px;
    background:var(--border-on-dark);
  }
  .scroll-container{padding-bottom:40px;position:relative;z-index:1;}

  /* ---------- SONG NAV (prev/next) ---------- */
  .song-nav-btn{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:42px;height:42px;
    border-radius:50%;
    background:var(--bg-glass);
    border:1px solid var(--border-on-dark);
    color:var(--on-dark);
    font-size:20px;
    display:flex;align-items:center;justify-content:center;
    z-index:12;
    backdrop-filter:blur(6px);
    box-shadow:0 8px 20px rgba(12,20,14,0.28);
  }
  .song-nav-btn:hover{border-color:var(--gold-light);color:var(--gold-light);}
  .nav-prev{left:14px;}
  .nav-next{right:14px;}
  @media (max-width:600px){
    .song-nav-btn{width:36px;height:36px;font-size:17px;}
    .nav-prev{left:8px;}
    .nav-next{right:8px;}
  }

  /* ---------- EDITOR: META STEP ---------- */
  .editor-meta label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .editor-meta input, .editor-meta textarea{
    display:block;
    width:100%;
    margin-top:6px;
  }
  .editor-meta textarea{
    font-family:var(--font-mono);
    line-height:1.6;
    resize:vertical;
  }
  .field-hint{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:6px;text-transform:none;letter-spacing:0;}

  /* ---------- EDITOR: CHORD PLACEMENT ---------- */
  .help-bar{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-size:12px;
    color:var(--muted-on-dark);
    padding:10px 24px;
    border-bottom:1px solid var(--border-on-dark);
    align-items:center;
    background:var(--bg-glass);
    position:relative;
    z-index:1;
  }
  .help-bar kbd{
    background:rgba(255,255,255,0.1);
    border:1px solid var(--border-on-dark);
    border-radius:5px;
    padding:1px 6px;
    font-family:var(--font-mono);
    color:var(--on-dark);
  }
  .help-bar .reedit{margin-left:auto;color:var(--gold-light);}
  .help-bar .reedit:hover{text-decoration:underline;}

  .title-inline-row{display:flex;gap:10px;flex:1;min-width:0;}
  .title-inline-row input{
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    padding:4px 2px;
    font-size:16px;
    font-weight:600;
    width:auto;
    min-width:80px;
    color:var(--on-dark);
  }
  .title-inline-row input:nth-child(2){font-weight:400;font-size:13px;color:var(--muted-on-dark);}
  .title-inline-row input:hover, .title-inline-row input:focus{border-bottom:1px solid var(--border-on-dark);}

  .editor-chords{outline:none;}
  .editor-chords .line{
    padding:3px 4px;
    border-radius:8px;
    margin-bottom:0;
  }
  .editor-chords .active-line{background:var(--leaf-soft);}
  .editor-chords .lyrics-row{cursor:text;}
  .editor-chords .chord{
    cursor:grab;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .editor-chords .chord.dragging{
    cursor:grabbing;
    background:rgba(199,154,46,0.35);
    z-index:6;
  }

  .caret{
    position:absolute;
    top:2px;
    width:2px;
    height:18px;
    background:var(--leaf);
    animation:blink 1s step-start infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .chord-popup{
    position:absolute;
    top:-2px;
    width:80px;
    padding:2px 6px;
    font-size:13px;
    font-family:var(--font-mono);
    font-weight:700;
    color:var(--gold-strong);
    background:#fff9ea;
    border:1px solid var(--gold);
    border-radius:6px;
    z-index:5;
  }

  .mobile-controls{
    position:fixed;
    left:0;right:0;bottom:0;
    display:flex;
    gap:6px;
    padding:10px 14px;
    background:var(--bg-glass);
    border-top:1px solid var(--border-on-dark);
    overflow-x:auto;
    z-index:10;
  }
  .mobile-controls button{
    flex:1;
    white-space:nowrap;
    background:rgba(255,255,255,0.08);
    color:var(--on-dark);
    border:1px solid var(--border-on-dark);
    padding:10px 12px;
    border-radius:var(--radius-control);
    font-size:13px;
  }
  .mobile-controls button:active{background:rgba(255,255,255,0.16);}
  .editor-chords{padding-bottom:90px;}

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translate(-50%, 20px);
    background:var(--ink);
    border:1px solid rgba(255,255,255,0.12);
    color:var(--on-dark);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    z-index:100;
    pointer-events:none;
    max-width:90vw;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%, 0);}

  .confirm-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,16,11,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:20px;
  }
  .confirm-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:22px;
    max-width:400px;
    width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    max-height:82vh;
    overflow-y:auto;
  }
  .confirm-box h3{margin:0 0 14px;font-size:17px;font-family:var(--font-serif);color:var(--ink);}
  .confirm-box p{margin:0 0 18px;font-size:14px;line-height:1.5;color:var(--ink);}
  .confirm-box label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .confirm-box label input{display:block;width:100%;margin-top:5px;}
  .confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  .modal-sub{font-size:13px;color:var(--muted);margin:-8px 0 16px;}

  .list-check-group{max-height:260px;overflow-y:auto;margin-bottom:14px;}
  .list-check-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 4px;
    border-bottom:1px solid var(--border);
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .list-check-row:last-child{border-bottom:none;}
  .list-check-row input{width:auto;margin:0;padding:0;accent-color:var(--gold-strong);}
  .list-check-row span:nth-child(2){flex:1;}
  .list-check-count{color:var(--muted);font-size:12px;white-space:nowrap;}
  .new-list-row{display:flex;gap:8px;margin-bottom:6px;}
  .new-list-row input{flex:1;margin:0;}
  .muted-note{color:var(--muted);font-size:13px;}

  /* ---------- LIST DETAIL (playlists) ---------- */
  .list-song-rows{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;}
  .list-song-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
    box-shadow:0 4px 12px rgba(12,20,14,0.08);
  }
  .list-song-row.dragging-row{opacity:0.55;border-color:var(--gold);}
  .drag-handle{
    color:var(--muted);
    font-size:16px;
    padding:6px;
    cursor:grab;
    touch-action:none;
  }
  .drag-handle:active{cursor:grabbing;}
  .list-song-info{flex:1;min-width:0;cursor:pointer;}
  .lsr-title{font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lsr-artist{font-size:12.5px;color:var(--muted);}

  /* ---------- AUTENTICAÇÃO ---------- */
  .auth-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    z-index:1;
  }
  .auth-card{width:100%;max-width:380px;}
  .auth-title{
    margin:0 0 16px;
    font-size:20px;
    text-align:center;
    font-family:var(--font-serif);
    color:var(--ink);
  }
  .auth-card label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .auth-card input{display:block;width:100%;margin-top:6px;}
  .auth-submit{width:100%;margin-top:4px;}
  .auth-links{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .auth-links a{
    font-size:12.5px;
    color:var(--leaf);
    cursor:pointer;
    text-decoration:none;
  }
  .auth-links a:hover{text-decoration:underline;}
  .auth-error{
    background:var(--danger-soft);
    border:1px solid var(--danger);
    color:var(--danger);
    font-size:13px;
    padding:10px 12px;
    border-radius:var(--radius-control);
    margin-bottom:16px;
  }
  .user-email{
    color:var(--muted-on-dark);
    font-size:12.5px;
    align-self:center;
    max-width:160px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .btn-primary:disabled{opacity:0.6;cursor:default;}

  @media (max-width:600px){
    .container{padding:20px 16px 100px;}
    .topbar{padding:14px 16px;}
    .paper{padding:18px 16px 14px;border-radius:16px;}
    .user-email{display:none;}
  }
</style>

  // Curva quadrática: a faixa baixa/média fica bem devagar e só perto do topo acelera de verdade.
  const MAX_SPEED_PX = 1.4;

  function uid(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){
    return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function cssEscapeAttr(str){

  function uniqueSorted(arr){

  // Substitui window.confirm(): diálogos nativos (confirm/alert/prompt) costumam
  // ficar bloqueados dentro do iframe isolado em que este app roda, então usamos
  // caixas próprias, no mesmo estilo visual do app.
  function showConfirm(message){
    return new Promise(resolve=>{
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML = `
        <div class="confirm-box">
          <p>${escapeHtml(message)}</p>
          <div class="confirm-actions">
            <button class="btn-secondary" data-choice="cancel" style="color:var(--ink);border-color:var(--border);">Cancelar</button>
            <button class="btn-primary" data-choice="ok">Continuar</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      function cleanup(){ overlay.remove(); }
      overlay.addEventListener('click', e=>{
        const btn = e.target.closest('[data-choice]');
        if(!btn){
          if(e.target===overlay){ cleanup(); resolve(false); }
          return;
        }
        cleanup();
        resolve(btn.dataset.choice==='ok');
      });
    });
  }

  function showPrompt(message, defaultValue){
    return new Promise(resolve=>{
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML = `
        <div class="confirm-box">
          <p>${escapeHtml(message)}</p>
          <input id="promptInput" value="${escapeHtml(defaultValue||'')}" style="width:100%;margin-bottom:16px;">
          <div class="confirm-actions">
            <button class="btn-secondary" data-choice="cancel" style="color:var(--ink);border-color:var(--border);">Cancelar</button>
            <button class="btn-primary" data-choice="ok">Salvar</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const inp = overlay.querySelector('#promptInput');
      setTimeout(()=>{ inp.focus(); inp.select(); }, 0);
      function cleanup(){ overlay.remove(); }
      overlay.addEventListener('click', e=>{
        const btn = e.target.closest('[data-choice]');
        if(!btn){
          if(e.target===overlay){ cleanup(); resolve(null); }
          return;
        }
        cleanup();
        resolve(btn.dataset.choice==='ok' ? inp.value.trim() : null);
      });
      inp.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ e.preventDefault(); cleanup(); resolve(inp.value.trim()); }
        else if(e.key==='Escape'){ e.preventDefault(); cleanup(); resolve(null); }
      });
    });
  }

  /* ================= AUTENTICAÇÃO ================= */
  const AUTH_STORAGE_KEY = 'cifrario_auth_session';

  function saveSessionToStorage(){
    try{
      if(state.session) localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(state.session));
      else localStorage.removeItem(AUTH_STORAGE_KEY);
    }catch(e){ /* localStorage indisponível — a sessão só dura a aba atual */ }
  }
  function loadSessionFromStorage(){
    try{
      const raw = localStorage.getItem(AUTH_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function authedHeaders(){
    const token = (state.session && state.session.access_token) || SUPABASE_ANON_KEY;
    return {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    };
  }

  function authErrorMessage(data, fallback){
    if(!data) return fallback;
    return data.msg || data.error_description || data.error || fallback;
  }

  // fetch autenticado: se o token expirou (401), tenta renovar com o
  // refresh_token uma vez e refaz a chamada antes de desistir.
  async function authFetch(url, options){
    options = options || {};
    const headers = Object.assign({}, authedHeaders(), options.headers || {});
    options.headers = headers;
    let res = await fetch(url, options);
    if(res.status === 401 && state.session && state.session.refresh_token){
      try{
        const data = await apiRefreshToken(state.session.refresh_token);
        setSessionFromAuthResponse(data);
        headers['Authorization'] = 'Bearer ' + state.session.access_token;
        res = await fetch(url, options);
      }catch(e){
        await signOut();
        throw new Error('Sua sessão expirou. Entre novamente.');
      }
    }
    return res;
  }

  async function apiSignUp(email, password){

      method: 'POST',

  async function apiUpdatePassword(accessToken, newPassword){

    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(authErrorMessage(data, 'Não foi possível definir a nova senha.'));
    return data;

  function setSessionFromAuthResponse(data){
    state.session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      user: data.user ? { id: data.user.id, email: data.user.email } : (state.session ? state.session.user : null)
    };
    saveSessionToStorage();
  }

  async function ensureUserInfo(){
    if(state.session && state.session.user) return;
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers: authedHeaders() });
    if(!res.ok) throw new Error('unauthorized');
    const u = await res.json();
    state.session.user = { id: u.id, email: u.email };
    saveSessionToStorage();
  }

      setSessionFromAuthResponse({ access_token: state._recoveryToken, refresh_token: state._recoveryRefreshToken, user: data });
      showToast('Senha atualizada!');

  // Verifica se a URL veio de um link de e-mail do Supabase (recuperação de
  // senha ou confirmação de cadastro) antes de mostrar qualquer tela.
  function checkAuthRedirect(){
    const hash = window.location.hash;
    if(!hash || hash.indexOf('access_token')===-1) return false;
    const params = new URLSearchParams(hash.slice(1));
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    const type = params.get('type');
    if(!accessToken) return false;
    history.replaceState(null, '', window.location.pathname + window.location.search);
    if(type === 'recovery'){
      state._recoveryToken = accessToken;
      state._recoveryRefreshToken = refreshToken;
      state.view = 'resetPassword';
      return true;
    }
    state.session = { access_token: accessToken, refresh_token: refreshToken, user: null };
    saveSessionToStorage();
    return 'login-direct';
  }

  async function enterApp(){
    await ensureUserInfo();
    state.view = 'list';
    render();
    await loadSongs();
    await loadLists();
    await loadFavorites();
  }

  async function init(){
    render(); // mostra a tela de carregamento imediatamente, antes de checar a sessão
    const redirectResult = checkAuthRedirect();
    if(redirectResult === true){ render(); return; }
    if(redirectResult === 'login-direct'){ await enterApp(); return; }
    const stored = loadSessionFromStorage();
    if(stored && stored.access_token){
      state.session = stored;
      try{
        await ensureUserInfo();
        await enterApp();
        return;
      }catch(e){
        try{
          const data = await apiRefreshToken(stored.refresh_token);
          setSessionFromAuthResponse(data);
          await ensureUserInfo();
          await enterApp();
          return;
        }catch(e2){
          state.session = null;
          saveSessionToStorage();
        }
      }
    }
    state.view = 'login';
    render();
  }

  /* ================= STORAGE: MÚSICAS (compartilhadas entre todos) ================= */
  function songFromRow(r){
    return {
      id: r.id,
      title: r.title || '',
      artist: r.artist || '',
      tone: r.tone || '',
      theme: r.theme || '',
      links: r.links && typeof r.links==='object' ? {
        youtube: r.links.youtube||'', spotify: r.links.spotify||'',
        deezer: r.links.deezer||'', other: r.links.other||''
      } : { youtube:'', spotify:'', deezer:'', other:'' },
      lines: Array.isArray(r.lines) ? r.lines : []
    };
  }

  async function loadSongs(){
    try {
      const res = await authFetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_SONGS_TABLE}?select=*&order=title.asc`);
      if(!res.ok) throw new Error('http-' + res.status);
      const rows = await res.json();
      state.songs = rows.map(songFromRow);
    } catch (e) {
      console.error('Erro ao carregar músicas:', e);
      state.songs = [];
      showToast('Não foi possível carregar o acervo. Confira sua conexão.');
    }
    state.loaded = true;
    render();
  }

  async function persistSong(song){
    try {
      const res = await authFetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_SONGS_TABLE}?on_conflict=id`, {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{
          id: song.id, title: song.title, artist: song.artist,
          tone: song.tone, theme: song.theme||'', links: song.links||{},
          lines: song.lines, updated_at: new Date().toISOString()
        }])
      });
      if(!res.ok) throw new Error('http-' + res.status);
      return true;
    } catch (e) {
      console.error('Erro ao salvar música:', e);
      showToast('Não foi possível salvar. Confira sua conexão.');
      return false;
    }
  }

  async function removeSongRemote(id){
    try {
      const res = await authFetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_SONGS_TABLE}?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' });
      if(!res.ok) throw new Error('http-' + res.status);
      return true;
    } catch (e) {
      console.error('Erro ao excluir música:', e);
      showToast('Não foi possível excluir.');
      return false;
    }

  /* ================= STORAGE: LISTAS (uma por usuário) ================= */
  function listFromRow(r){

      id: r.id,
      name: r.name || 'Lista sem nome',
      songIds: Array.isArray(r.song_ids) ? r.song_ids : []
    };

  async function loadLists(){
    try {

  async function persistList(list){
    try {
      const res = await authFetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_LISTS_TABLE}?on_conflict=id`, {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{
          id: list.id, name: list.name, song_ids: list.songIds,
          user_id: state.session.user.id, updated_at: new Date().toISOString()
        }])
      });
      if(!res.ok) throw new Error('http-' + res.status);
      return true;
    } catch (e) {
      console.error('Erro ao salvar lista:', e);
      showToast('Não foi possível salvar a lista.');
      return false;
    }

  async function removeListRemote(id){
    try {
      const res = await authFetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_LISTS_TABLE}?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' });
      if(!res.ok) throw new Error('http-' + res.status);
      return true;
    } catch (e) {

  function isSongInList(list, songId){ return list.songIds.indexOf(songId) >= 0; }
  async function toggleSongInList(list, songId){
    const idx = list.songIds.indexOf(songId);
    if(idx>=0) list.songIds.splice(idx,1); else list.songIds.push(songId);
    await persistList(list);
  }

  /* ================= STORAGE: FAVORITOS (por usuário) ================= */
  async function loadFavorites(){
    try {
      const uidCurrent = state.session.user.id;
      const res = await authFetch(`${SUPABASE_URL}/rest/v1/cifrario_favorites?select=song_id&user_id=eq.${uidCurrent}`);
      if(!res.ok) throw new Error('http-' + res.status);
      const rows = await res.json();
      state.favoriteIds = new Set(rows.map(r=>r.song_id));
    } catch (e) {
      console.error('Erro ao carregar favoritos:', e);
      state.favoriteIds = new Set();
    }
    render();
  }

  async function addFavorite(songId){
    state.favoriteIds.add(songId);
    render();
    try {
      const res = await authFetch(`${SUPABASE_URL}/rest/v1/cifrario_favorites`, {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{ user_id: state.session.user.id, song_id: songId }])
      });
      if(!res.ok) throw new Error('http-' + res.status);
    } catch (e) {
      console.error('Erro ao favoritar:', e);
      state.favoriteIds.delete(songId);
      showToast('Não foi possível favoritar.');
      render();
    }

  async function removeFavorite(songId){
    state.favoriteIds.delete(songId);
    render();
    try {
      const res = await authFetch(`${SUPABASE_URL}/rest/v1/cifrario_favorites?song_id=eq.${encodeURIComponent(songId)}&user_id=eq.${state.session.user.id}`, { method: 'DELETE' });
      if(!res.ok) throw new Error('http-' + res.status);
    } catch (e) {
      console.error('Erro ao desfavoritar:', e);
      state.favoriteIds.add(songId);
      showToast('Não foi possível remover dos favoritos.');
      render();
    }

  async function toggleFavorite(id){
    if(state.favoriteIds.has(id)){
      await removeFavorite(id);
      showToast('Removida dos favoritos.');
    } else {
      await addFavorite(id);
      showToast('Adicionada aos favoritos.');

    state.openMenuId = null;
    render();

  function goView(id, contextIds, fromListId){

  /* ================= MODAL: ADICIONAR A UMA LISTA ================= */
  function openAddToListModal(songId){
    const song = state.songs.find(s=>s.id===songId);
    if(!song) return;
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    document.body.appendChild(overlay);

    function renderModal(){
      const rows = state.lists.map(l => `
        <label class="list-check-row">
          <input type="checkbox" data-list-id="${l.id}" ${isSongInList(l, songId) ? 'checked' : ''}>
          <span>${escapeHtml(l.name)}</span>
          <span class="list-check-count">${l.songIds.length} música${l.songIds.length===1?'':'s'}</span>
        </label>`).join('') || `<p class="muted-note">Você ainda não criou nenhuma lista. Crie uma abaixo.</p>`;
      overlay.innerHTML = `
        <div class="confirm-box">
          <h3>Adicionar "${escapeHtml(song.title)||'Sem título'}" a uma lista</h3>
          <div class="list-check-group">${rows}</div>
          <div class="new-list-row">
            <input id="newListNameInput" placeholder="Nome da nova lista" maxlength="60">
            <button class="btn-primary" id="createListBtn">Criar</button>
          </div>
          <div class="confirm-actions"><button class="btn-secondary" id="closeListsModalBtn" style="color:var(--ink);border-color:var(--border);">Concluído</button></div>
        </div>`;
      overlay.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        cb.addEventListener('change', async ()=>{
          const list = state.lists.find(l=>l.id===cb.dataset.listId);
          if(!list) return;
          await toggleSongInList(list, songId);
          showToast(isSongInList(list, songId) ? `Adicionada a "${list.name}".` : `Removida de "${list.name}".`);
          renderModal();
        });
      });
      const nameInput = overlay.querySelector('#newListNameInput');
      overlay.querySelector('#createListBtn').addEventListener('click', async ()=>{
        const name = nameInput.value.trim();
        if(!name){ nameInput.focus(); return; }
        const list = { id: uid(), name, songIds: [songId] };
        state.lists.push(list);
        await persistList(list);
        showToast('Lista criada.');
        renderModal();
      });
      nameInput.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ e.preventDefault(); overlay.querySelector('#createListBtn').click(); }
      });
      overlay.querySelector('#closeListsModalBtn').addEventListener('click', ()=>{ overlay.remove(); render(); });
    }
    overlay.addEventListener('click', e=>{ if(e.target===overlay){ overlay.remove(); render(); } });
    renderModal();
  }

    if(state.view==='list') app.innerHTML = renderList();

    else if(state.view==='listDetail') app.innerHTML = renderListDetail();
    else if(state.view==='view') app.innerHTML = renderSongView(state.songs.find(s=>s.id===state.currentId));

      return true;

  /* ---- arrastar para reordenar músicas dentro de uma lista ---- */
  let listDrag = null;
  function beginListDrag(e){
    if(state.view !== 'listDetail') return;
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const row = handle.closest('.list-song-row');
    if(!row) return;
    const list = state.lists.find(l=>l.id===state.currentListId);
    if(!list) return;
    e.preventDefault();
    listDrag = { list, draggingId: row.dataset.songId, pointerId: e.pointerId };
    row.classList.add('dragging-row');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  }
  function onListDragMove(e){
    if(!listDrag || e.pointerId !== listDrag.pointerId) return;
    const container = document.getElementById('listSongRows');
    if(!container) return;
    const rows = Array.from(container.querySelectorAll('.list-song-row'));
    const list = listDrag.list;
    const currentIndex = list.songIds.indexOf(listDrag.draggingId);
    for(const r of rows){
      if(r.dataset.songId === listDrag.draggingId) continue;
      const rect = r.getBoundingClientRect();
      const mid = rect.top + rect.height/2;
      const otherIndex = list.songIds.indexOf(r.dataset.songId);
      if(otherIndex<0) continue;
      if(e.clientY < mid && otherIndex < currentIndex){
        list.songIds.splice(currentIndex,1);
        list.songIds.splice(otherIndex,0,listDrag.draggingId);
        renderListDetailRows();
        break;
      } else if(e.clientY > mid && otherIndex > currentIndex){
        list.songIds.splice(currentIndex,1);
        list.songIds.splice(otherIndex,0,listDrag.draggingId);
        renderListDetailRows();
        break;
      }
    }
  }
  function onListDragEnd(e){
    if(!listDrag || e.pointerId !== listDrag.pointerId) return;
    const { list } = listDrag;
    listDrag = null;
    persistList(list);
    renderListDetailRows();
  }

  /* ================= SONG SHEET (shared render for view + editor) ================= */

    }
    const chordsHtml = line.chords.map(c =>
      `<span class="chord" style="left:${c.pos}ch">${escapeHtml(c.chord)}</span>`
    ).join('');
    return `<div class="line">
      <div class="chords-row">${chordsHtml}</div>
      <div class="lyrics-row">${escapeHtml(line.text) || '&nbsp;'}</div>
    </div>`;
  }

  function renderSongView(song){
    if(!song) return renderList();
    const linesHtml = song.lines.map(lineHtml).join('');

    const ctx = state.navContext;
    let prevId = null, nextId = null;
    if(Array.isArray(ctx)){
      const idx = ctx.indexOf(song.id);
      if(idx > 0) prevId = ctx[idx-1];
      if(idx >= 0 && idx < ctx.length-1) nextId = ctx[idx+1];
    }

    const isFav = state.favoriteIds.has(song.id);

    const links = song.links || {};
    const linkChips = [];
    if(links.youtube) linkChips.push(`<a class="link-chip" href="${escapeHtml(links.youtube)}" target="_blank" rel="noopener">&#9654; YouTube</a>`);
    if(links.spotify) linkChips.push(`<a class="link-chip" href="${escapeHtml(links.spotify)}" target="_blank" rel="noopener">&#9834; Spotify</a>`);
    if(links.deezer) linkChips.push(`<a class="link-chip" href="${escapeHtml(links.deezer)}" target="_blank" rel="noopener">&#9834; Deezer</a>`);
    if(links.other) linkChips.push(`<a class="link-chip" href="${escapeHtml(links.other)}" target="_blank" rel="noopener">&#128279; Ouvir</a>`);

    const metaBits = [];
    if(song.artist) metaBits.push(escapeHtml(song.artist));
    if(song.tone) metaBits.push('Tom: '+escapeHtml(song.tone));
    if(song.theme) metaBits.push(escapeHtml(song.theme));

    return `
      <header class="topbar">
        <button class="topbar-back" data-action="back">&#8592; Voltar</button>
        <div class="song-title-block">
          <h1>${escapeHtml(song.title)||'Sem título'}</h1>
          <span>${metaBits.join(' · ')}</span>

          <button class="icon-btn ${isFav?'fav-on':''}" data-action="toggleFavorite" data-id="${song.id}" title="${isFav?'Remover dos favoritos':'Favoritar'}">${isFav?'&#9733;':'&#9734;'}</button>

        </main>
      </div>
      ${prevId ? `<button class="song-nav-btn nav-prev" data-action="navPrev" title="Cifra anterior">&#8249;</button>` : ''}
      ${nextId ? `<button class="song-nav-btn nav-next" data-action="navNext" title="Próxima cifra">&#8250;</button>` : ''}

  /* ================= EDITOR: CHORD PLACEMENT ================= */
  function editorLineHtml(line, i, ed){

      `<span class="chord" data-line-index="${i}" data-chord-index="${ci}" style="left:${c.pos}ch">${escapeHtml(c.chord)}</span>`

      `<input id="chordPopupInput" class="chord-popup" style="left:${ed.cursorPos}ch" value="${escapeHtml(ed.popupValue)}" placeholder="Am">` : '';
    return `<div class="line ${isActive?'active-line':''}" data-line-index="${i}">
      <div class="chords-row">${chordsHtml}${caretHtml}${popupHtml}</div>
      <div class="lyrics-row" data-line-index="${i}">${escapeHtml(line.text) || '&nbsp;'}</div>
    </div>`;
  }

  /* ================= EDITOR ACTIONS ================= */
  function goToChords(){
    const ed = state.editor;
    const title = document.getElementById('titleInput').value.trim();
    const artist = document.getElementById('artistInput').value.trim();
    const toneEl = document.getElementById('toneInput');
    const themeEl = document.getElementById('themeInput');
    ed.tone = toneEl ? toneEl.value.trim() : (ed.tone||'');
    ed.theme = themeEl ? themeEl.value.trim().replace(/\s+/g,'') : (ed.theme||'');
    const raw = document.getElementById('lyricsTextarea').value;
    const newLinesText = raw.split('\n');
    const oldLines = ed.lines || [];
    const newLines = newLinesText.map((text,i) => {
      const old = oldLines[i];
      if(old && old.chords && old.chords.length){
        // Mantém as cifras da mesma linha mesmo que o texto tenha mudado
        // (ex.: corrigir um typo), só ajustando a posição ao novo tamanho.
        const chords = old.chords.map(c => ({
          ...c,
          pos: Math.max(0, Math.min(text.length, c.pos))
        }));
        return { text, chords };
      }
      return { text, chords: [] };
    });
    ed.title = title;
    ed.artist = artist;
    ed.lines = newLines;
    ed.activeLine = 0;
    ed.cursorPos = 0;
    ed.popupOpen = false;
    ed.popupValue = '';
    state.view = 'editChords';
    render();
  }

  async function reeditText(){
    const ed = state.editor;
    if(ed.lines.some(l=>l.chords.length>0)){
      const ok = await showConfirm('As cifras ficam vinculadas à posição de cada linha. Se você adicionar ou remover linhas de texto, as cifras podem acabar na linha errada — mas só editar o texto (corrigir palavras, por exemplo) não afeta as cifras. Deseja continuar?');
      if(!ok) return;
    }
    state.view = 'editMeta';
    render();
  }

  function cancelEdit(){
    state.editor = null;
    if(state.currentId) goView(state.currentId); else goList();
  }

  async function finishEdit(){
    const ed = state.editor;
    const titleEl = document.getElementById('titleInline') || document.getElementById('titleInput');
    const artistEl = document.getElementById('artistInline') || document.getElementById('artistInput');
    const title = (titleEl ? titleEl.value : ed.title).trim() || 'Sem título';
    const artist = (artistEl ? artistEl.value : ed.artist).trim();
    const song = {
      id: ed.id || uid(),
      title, artist,
      tone: (ed.tone||'').trim(),
      theme: (ed.theme||'').trim(),
      links: ed.links || {youtube:'',spotify:'',deezer:'',other:''},
      lines: ed.lines.map(l => ({ text: l.text, chords: [...l.chords].sort((a,b)=>a.pos-b.pos) }))
    };
    const idx = state.songs.findIndex(s=>s.id===song.id);
    if(idx>=0) state.songs[idx] = song; else state.songs.push(song);
    await persistSong(song);
    showToast('Música salva.');
    state.editor = null;
    goView(song.id);
  }

  async function deleteSong(id){
    const song = state.songs.find(s=>s.id===id);
    if(!song) return;
    const ok = await showConfirm(`Excluir "${song.title}"? Essa ação não pode ser desfeita.`);
    if(!ok) return;
    state.songs = state.songs.filter(s=>s.id!==id);
    // remove a música de qualquer lista personalizada que a contenha
    state.lists.forEach(l=>{
      const before = l.songIds.length;
      l.songIds = l.songIds.filter(sid=>sid!==id);
      if(l.songIds.length !== before) persistList(l);
    });
    await removeSongRemote(id);
    state.favoriteIds.delete(id);
    state.openMenuId = null;
    if(state.currentId===id) goList(); else render();
  }

  /* ---- cursor / chord placement ---- */
  function activeLine(){ return state.editor.lines[state.editor.activeLine]; }

  function moveCursor(delta){
    const ed = state.editor;
    const line = activeLine();
    ed.cursorPos = Math.max(0, Math.min(line.text.length, ed.cursorPos + delta));
    renderEditorSheetOnly();
  }

  function changeActiveLine(delta){
    const ed = state.editor;
    const newIndex = Math.max(0, Math.min(ed.lines.length-1, ed.activeLine + delta));
    ed.activeLine = newIndex;
    ed.cursorPos = Math.min(ed.cursorPos, ed.lines[newIndex].text.length);
    ed.popupOpen = false;
    renderEditorSheetOnly();
  }

  function openChordPopup(){
    const ed = state.editor;
    ed.popupOpen = true;
    ed.popupValue = '';
    renderEditorSheetOnly();
  }

  function confirmChordPopup(){
    const ed = state.editor;
    const inp = document.getElementById('chordPopupInput');
    const val = inp ? inp.value.trim() : '';
    if(val){
      const line = activeLine();
      const existingIdx = line.chords.findIndex(c=>c.pos===ed.cursorPos);
      if(existingIdx>=0) line.chords[existingIdx].chord = val;
      else line.chords.push({ pos: ed.cursorPos, chord: val });
      line.chords.sort((a,b)=>a.pos-b.pos);
    }
    ed.popupOpen = false;
    renderEditorSheetOnly();
    focusSheet();
  }

  function cancelChordPopup(){
    state.editor.popupOpen = false;
    renderEditorSheetOnly();
    focusSheet();
  }

  function removeChordAtCursor(){
    const ed = state.editor;
    const line = activeLine();
    const idx = line.chords.findIndex(c=>c.pos===ed.cursorPos);
    if(idx>=0) line.chords.splice(idx,1);
    renderEditorSheetOnly();
  }

  function focusSheet(){
    const sheet = document.getElementById('editorSheet');
    if(sheet) sheet.focus();
  }

  function getChWidth(){
    if(chWidthCache) return chWidthCache;
    const span = document.createElement('span');
    span.style.fontFamily = "'JetBrains Mono', monospace";
    span.style.fontSize = '16px';
    span.style.position = 'absolute';
    span.style.visibility = 'hidden';
    span.textContent = 'M'.repeat(40);
    document.body.appendChild(span);
    chWidthCache = span.getBoundingClientRect().width / 40;
    document.body.removeChild(span);
    return chWidthCache;
  }

  /* ---- arrastar acordes já inseridos com o mouse (clicar e segurar) ---- */
  let chordDrag = null;
  function onChordPointerDown(e){
    if(state.view !== 'editChords') return;
    const el = e.target.closest('.chord');
    if(!el) return;
    e.preventDefault();
    e.stopPropagation();
    const lineIndex = parseInt(el.dataset.lineIndex, 10);
    const chordIndex = parseInt(el.dataset.chordIndex, 10);
    const line = state.editor.lines[lineIndex];
    const chord = line && line.chords[chordIndex];
    if(!chord) return;
    chordDrag = {
      el, lineIndex, chordIndex,
      startX: e.clientX,
      startPos: chord.pos,
      currentPos: chord.pos,
      maxPos: line.text.length,
      chWidth: getChWidth(),
      pointerId: e.pointerId
    };
    el.classList.add('dragging');
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  }
  function onChordPointerMove(e){
    if(!chordDrag || e.pointerId !== chordDrag.pointerId) return;
    const deltaPx = e.clientX - chordDrag.startX;
    const deltaCh = deltaPx / chordDrag.chWidth;
    let newPos = Math.round(chordDrag.startPos + deltaCh);
    newPos = Math.max(0, Math.min(chordDrag.maxPos, newPos));
    chordDrag.currentPos = newPos;
    chordDrag.el.style.left = newPos + 'ch';
  }
  function onChordPointerUp(e){
    if(!chordDrag || e.pointerId !== chordDrag.pointerId) return;
    const { lineIndex, chordIndex, currentPos, el } = chordDrag;
    el.classList.remove('dragging');
    try{ el.releasePointerCapture(e.pointerId); }catch(err){}
    const line = state.editor && state.editor.lines[lineIndex];
    if(line && line.chords[chordIndex]) line.chords[chordIndex].pos = currentPos;
    chordDrag = null;
    renderEditorSheetOnly();
  }

  /* ================= PDF IMPORT ================= */
  function isChordToken(tok){
    if(!tok) return false;
    if(/[a-z]{4,}/.test(tok)) return false; // long lowercase run -> a real word, not a chord
    return /^\(?[A-G](#|b)?[A-Za-z0-9°ºmM\/\(\)\+\-]*\)?$/.test(tok);
  }

  function groupTextIntoRows(items){
    const rows = [];
    const tolerance = 2.5;
    items.forEach(it=>{
      if(!it.str || !it.str.trim()) return;
      let row = rows.find(r=>Math.abs(r.y - it.y) <= tolerance);
      if(!row){ row = { y: it.y, items: [] }; rows.push(row); }
      row.items.push(it);
    });
    rows.forEach(r=> r.items.sort((a,b)=>a.x-b.x));
    rows.sort((a,b)=> b.y - a.y);
    return rows;
  }

  function rowText(row){ return row.items.map(it=>it.str.trim()).join(' ').trim(); }

  function rowIsChordRow(row){
    const toks = row.items.map(it=>it.str.trim()).filter(Boolean);
    return toks.length>0 && toks.every(isChordToken);
  }

  async function extractPdfRows(file){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let allItems = [];
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      content.items.forEach(it=>{
        if(!it.str || !it.str.trim()) return;
        allItems.push({
          str: it.str,
          x: it.transform[4],
          y: it.transform[5] - p*10000, // offset each page so rows never merge across pages
          width: it.width || (it.str.length * (Math.abs(it.transform[0])||6))
        });
      });
    }
    return groupTextIntoRows(allItems);
  }

  function buildSongFromRows(rows){
    rows = rows.filter(r=>rowText(r).length>0);
    if(rows.length===0) return null;

    let title = '', artist = '', tone = '';
    let titleFound = false, artistFound = false;
    const metaRegex = /^(Tom|Afina[cç][aã]o|Composi[cç][aã]o de|Capotraste)\s*:/i;
    const bodyRows = [];

    rows.forEach(r=>{
      const txt = rowText(r);
      const toneMatch = txt.match(/^Tom\s*:\s*(.+)$/i);
      if(toneMatch){ tone = toneMatch[1].trim(); return; }
      if(metaRegex.test(txt)) return;
      if(/^cifraclub$/i.test(txt)) return;
      if(!titleFound && !rowIsChordRow(r)){ title = txt; titleFound = true; return; }
      if(titleFound && !artistFound && !rowIsChordRow(r)){ artist = txt; artistFound = true; return; }
      bodyRows.push(r);
    });

    const ys = bodyRows.map(r=>r.y);
    const gaps = [];
    for(let i=1;i<ys.length;i++) gaps.push(ys[i-1]-ys[i]);
    gaps.sort((a,b)=>a-b);
    const lineStep = gaps.length ? gaps[Math.floor(gaps.length/2)] : 14;
    const fallbackCharWidth = 7;

    const lines = [];
    let pending = null;

    function flushInstrumental(){
      if(!pending) return;
      const x0 = pending.chords[0].x;
      const chords = pending.chords.map(c=>({
        pos: Math.max(0, Math.round((c.x - x0)/fallbackCharWidth)),
        chord: c.str
      }));
      lines.push({ text:'', chords });
      pending = null;
    }

    let prevY = null;
    bodyRows.forEach(row=>{
      if(prevY!==null && (prevY - row.y) > lineStep*1.6){
        flushInstrumental();
        lines.push({text:'', chords:[]});
      }
      if(rowIsChordRow(row)){
        flushInstrumental();
        pending = { chords: row.items.map(it=>({str:it.str.trim(), x:it.x})) };
      } else {
        const text = rowText(row);
        const x0 = row.items[0].x;
        const lastItem = row.items[row.items.length-1];
        const totalWidth = (lastItem.x + lastItem.width) - x0;
        const charWidth = text.length>0 ? Math.max(totalWidth / text.length, 3) : fallbackCharWidth;
        let chords = [];
        if(pending){
          chords = pending.chords.map(c=>({
            pos: Math.max(0, Math.min(text.length, Math.round((c.x - x0)/charWidth))),
            chord: c.str
          })).sort((a,b)=>a.pos-b.pos);
          pending = null;
        }
        lines.push({ text, chords });
      }
      prevY = row.y;
    });
    flushInstrumental();

    return { title, artist, tone, lines };
  }

  let pdfjsReadyPromise = null;
  function ensurePdfJs(){
    if(pdfjsReadyPromise) return pdfjsReadyPromise;
    pdfjsReadyPromise = new Promise((resolve, reject)=>{
      if(window.pdfjsLib){ resolve(); return; }
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = ()=>{
        // O aviso "Setting up fake worker" é só um aviso de desempenho: neste
        // tipo de iframe isolado, o navegador costuma bloquear a criação de um
        // Worker real a partir de um script de outra origem, então o pdf.js
        // processa o PDF na thread principal em vez de num worker separado.
        // A importação continua funcionando normalmente, só um pouco mais lenta.
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        resolve();
      };
      s.onerror = ()=> reject(new Error('load-failed'));
      document.head.appendChild(s);
    });
    return pdfjsReadyPromise;
  }

  async function handlePdfFile(file){
    showToast('Lendo o PDF...');
    try {
      await ensurePdfJs();
      const rows = await extractPdfRows(file);
      const parsed = buildSongFromRows(rows);
      if(!parsed || parsed.lines.length===0){
        showToast('Não consegui ler o conteúdo desse PDF.');
        return;
      }
      state.editor = {
        id: null,
        title: parsed.title,
        artist: parsed.artist,
        tone: parsed.tone,
        theme: '', // fica em branco — pode ser preenchido depois em "Editar texto, tom ou tema"
        links: {youtube:'',spotify:'',deezer:'',other:''},
        lines: parsed.lines,
        activeLine: 0,
        cursorPos: 0,
        popupOpen: false,
        popupValue: ''
      };
      state.view = 'editChords';
      render();
      showToast('Cifra importada — confira o posicionamento das notas. O tema ficou em branco, edite quando quiser.');
    } catch(e){
      console.error('Erro ao importar PDF:', e);
      showToast('Não foi possível importar esse PDF: ' + (e && e.message ? e.message : 'erro desconhecido'));
    }
  }

  /* ================= AUTOSCROLL ================= */
  function startAutoScroll(){
    // Quem rola de fato é a página (o #scrollContainer não tem overflow/altura
    // própria), então a rolagem automática precisa mexer no scroll da janela.
    state.autoScroll.active = true;
    let scrollAccumulator = 0; // guarda a fração de pixel entre os quadros
    function step(){
      if(!state.autoScroll.active) return;
      // Em velocidades baixas, menos de 1px por quadro seria arredondado para 0
      // e a tela nunca se moveria. Acumulamos a fração até ela virar 1px real,
      // garantindo rolagem suave em qualquer velocidade, mesmo bem lenta.
      scrollAccumulator += speedToPx(state.autoScroll.speed);
      const pixels = Math.floor(scrollAccumulator);
      if(pixels >= 1){
        window.scrollBy(0, pixels);
        scrollAccumulator -= pixels;
      }
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if(window.scrollY >= maxScroll - 2){
        state.autoScroll.active = false;
        updatePlayToggleUI();
        return;
      }
      scrollRAF = requestAnimationFrame(step);
    }
    scrollRAF = requestAnimationFrame(step);
    updatePlayToggleUI();
  }
  function stopAutoScroll(){
    state.autoScroll.active = false;
    if(scrollRAF) cancelAnimationFrame(scrollRAF);
    scrollRAF = null;
    updatePlayToggleUI();
  }
  function updatePlayToggleUI(){
    const btn = document.getElementById('playToggle');
    const icon = document.getElementById('playIcon');
    if(!btn) return;
    btn.classList.toggle('active', state.autoScroll.active);
    if(icon) icon.innerHTML = state.autoScroll.active ? '&#10074;&#10074;' : '&#9654;';
  }

      [emailEl, passEl].forEach(el=>{
        if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitMap[state.view](); } });
      });
      if(emailEl) emailEl.focus();
    }
    if(state.view==='resetPassword'){
      const pw = document.getElementById('newPasswordInput');
      if(pw){
        pw.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitNewPassword(); } });
        pw.focus();
      }
    }
    if(state.view==='list'){
      const s = document.getElementById('searchInput');
      if(s) s.addEventListener('input', e=>{ state.search = e.target.value; render(); const el=document.getElementById('searchInput'); if(el){ el.focus(); el.selectionStart = el.value.length; } });
      const fa = document.getElementById('filterArtist');
      if(fa) fa.addEventListener('change', e=>{ state.filterArtist = e.target.value; render(); });

      const themeEl = document.getElementById('themeInput');
      if(themeEl) themeEl.addEventListener('input', e=>{ e.target.value = e.target.value.replace(/\s/g,''); });
    }
    if(state.view==='editChords'){
      focusSheet();
    }
  }

  /* click on a lyric line in the editor to jump the cursor there */

    if(!row) return;
    const idx = parseInt(row.dataset.lineIndex,10);

  document.addEventListener('keydown', function(e){
    if(state.view!=='editChords') return;
    const active = document.activeElement;
    const inPopup = active && active.id === 'chordPopupInput';
    const inTitleFields = active && (active.id==='titleInline' || active.id==='artistInline');

    if(inPopup){
      if(e.key==='Enter'){ e.preventDefault(); confirmChordPopup(); }
      else if(e.key==='Escape'){ e.preventDefault(); cancelChordPopup(); }
      return;
    }
    if(inTitleFields) return;

    const ed = state.editor;
    if(!ed) return;
    switch(e.key){
      case ' ':
        e.preventDefault(); moveCursor(1); break;
      case 'ArrowRight':
        e.preventDefault(); moveCursor(1); break;
      case 'ArrowLeft':
        e.preventDefault(); moveCursor(-1); break;
      case 'ArrowDown':
        e.preventDefault(); changeActiveLine(1); break;
      case 'ArrowUp':
        e.preventDefault(); changeActiveLine(-1); break;
      case 'Enter':
        e.preventDefault(); openChordPopup(); break;
      case 'Backspace':
        e.preventDefault(); removeChordAtCursor(); break;
    }
  });

  document.getElementById('pdfFileInput').addEventListener('change', function(e){
    const file = e.target.files[0];
    e.target.value = '';
    if(file) handlePdfFile(file);
  });

  document.getElementById('app').addEventListener('pointerdown', function(e){
    onChordPointerDown(e);
    beginListDrag(e);
  });
  document.addEventListener('pointermove', function(e){
    onChordPointerMove(e);
    onListDragMove(e);
  });
  document.addEventListener('pointerup', function(e){
    onChordPointerUp(e);
    onListDragEnd(e);
  });
  document.addEventListener('pointercancel', function(e){
    onChordPointerUp(e);
    onListDragEnd(e);
  });

  /* ================= INIT ================= */
  init();
})();
</script>
</body>
</html>
