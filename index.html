<style>
  :root{
    --bg:#26432f;
    --bg-deep:#1c3323;
    --bg-glass:rgba(28,51,35,0.92);
    --surface:#ffffff;
    --surface-soft:#faf7ee;
    --surface-hover:#f2ecdb;
    --ink:#1f2b21;
    --ink-soft:#4c5c4e;
    --on-dark:#f7f4e8;
    --muted:#5c6b5e;
    --muted-on-dark:#dbe6dc;
    --gold:#c79a2e;
    --gold-strong:#a97f1f;
    --gold-light:#e4c05e;
    --gold-soft:rgba(199,154,46,0.16);
    --leaf:#3f6b4a;
    --leaf-light:#7fe39a;
    --leaf-soft:rgba(63,107,74,0.14);
    --danger:#b1454f;
    --danger-soft:rgba(177,69,79,0.12);
    --border:#e8e2cf;
    --border-on-dark:rgba(247,244,232,0.32);
    --radius-card:16px;
    --radius-control:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-serif:'Fraunces', serif;
    --font-mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(255,255,255,0.05), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-display);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{
    font-family:var(--font-display);
    cursor:pointer;
    border:none;
    background:none;
    color:inherit;
  }
  input,textarea,select{
    font-family:var(--font-display);
    background:var(--surface-soft);
    color:var(--ink);
    border:1px solid var(--border);
    border-radius:var(--radius-control);
    padding:10px 12px;
    font-size:15px;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  ::selection{background:var(--gold-light);color:#241505;}

  /* ---------- WATERMARK / BRAND ---------- */
  .watermark-logo{
    position:fixed;
    right:-46px;
    bottom:-46px;
    width:260px;
    max-width:38vw;
    opacity:0.07;
    pointer-events:none;
    z-index:0;
    user-select:none;
  }
  @media (max-width:600px){
    .watermark-logo{width:170px;right:-30px;bottom:-30px;}
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 24px;
    border-bottom:1px solid var(--border-on-dark);
    position:sticky;
    top:0;
    background:var(--bg-glass);
    backdrop-filter:blur(8px);
    z-index:10;
    color:var(--on-dark);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.2px;
    color:var(--on-dark);
    font-family:var(--font-serif);
  }
  .brand-logo{height:32px;width:auto;display:block;flex:none;}
  .brand .dot{color:var(--gold-light);}
  .brand-green{color:var(--leaf-light);}
  .topbar-back{
    font-size:14px;
    color:var(--muted-on-dark);
    padding:8px 10px;
    border-radius:var(--radius-control);
    white-space:nowrap;
  }
  .topbar-back:hover{color:var(--on-dark);background:rgba(255,255,255,0.08);}
  .song-title-block{flex:1;min-width:0;}
  .song-title-block h1{
    font-size:19px;
    margin:0;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-family:var(--font-serif);
    color:var(--on-dark);
  }
  .song-title-block span{
    color:var(--muted-on-dark);
    font-size:13px;
  }
  .topbar-actions{display:flex;gap:8px;flex:none;}
  .icon-btn{
    padding:8px 12px;
    border-radius:var(--radius-control);
    font-size:13px;
    color:var(--muted-on-dark);
    border:1px solid var(--border-on-dark);
    white-space:nowrap;
  }
  .icon-btn:hover{color:var(--on-dark);border-color:var(--muted-on-dark);}
  .icon-btn.danger:hover{color:#ff9ba3;border-color:#ff9ba3;}
  .icon-btn.fav-on{color:var(--gold-light);border-color:var(--gold-light);}
  .like-icon-btn{display:inline-flex;align-items:center;gap:6px;}
  .like-icon-btn span{color:var(--on-dark);font-weight:600;}

  .container{
    max-width:780px;
    margin:0 auto;
    padding:28px 24px 80px;
    position:relative;
    z-index:1;
  }

  .paper{
    background:var(--surface);
    border-radius:20px;
    padding:26px 26px 20px;
    box-shadow:0 18px 40px rgba(12,20,14,0.28);
  }

  /* ---------- LIST VIEW ---------- */
  .list-head{
    display:flex;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
    align-items:center;
  }
  .storage-banner{
    background:rgba(177,69,79,0.14);
    border:1px solid var(--danger);
    color:var(--on-dark);
    font-size:13px;
    line-height:1.5;
    padding:12px 14px;
    border-radius:var(--radius-control);
    margin-bottom:18px;
  }
  .search{flex:1;min-width:180px;}
  .btn-primary{
    background:var(--gold);
    color:#241505;
    font-weight:600;
    padding:10px 18px;
    border-radius:var(--radius-control);
    white-space:nowrap;
  }
  .btn-primary:hover{background:var(--gold-light);}
  .btn-secondary{
    background:rgba(255,255,255,0.08);
    color:var(--on-dark);
    font-weight:500;
    padding:10px 16px;
    border-radius:var(--radius-control);
    border:1px solid var(--border-on-dark);
    white-space:nowrap;
  }
  .btn-secondary:hover{border-color:var(--gold-light);color:var(--gold-light);}
  .list-head-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .filters-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:22px;
    align-items:center;
  }
  .filters-row select{
    min-width:150px;
    background:rgba(255,255,255,0.94);
  }
  .fav-filter-btn{
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,0.08);
    color:var(--on-dark);
    border:1px solid var(--border-on-dark);
    padding:9px 14px;
    border-radius:999px;
    font-size:13px;
    white-space:nowrap;
  }
  .fav-filter-btn:hover{border-color:var(--gold-light);}
  .fav-filter-btn.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-light);}

  .section-label{
    color:var(--on-dark);
    font-size:13px;
    letter-spacing:0.4px;
    text-transform:uppercase;
    opacity:0.75;
    margin:4px 0 12px;
  }

  .song-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:14px;
  }
  .song-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:16px;
    padding-bottom:38px;
    position:relative;
    z-index:1;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 16px rgba(12,20,14,0.10);
  }
  .song-card.menu-open{z-index:40;}
  .song-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 12px 24px rgba(12,20,14,0.16);}
  .song-card h3{
    margin:0 0 4px;
    font-size:17px;
    padding-right:64px;
    line-height:1.3;
    font-family:var(--font-serif);
    color:var(--ink);
  }
  .song-card .artist{color:var(--muted);font-size:13px;}
  .theme-tag{
    display:inline-block;
    margin-top:9px;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color:var(--leaf);
    background:var(--leaf-soft);
    padding:3px 9px;
    border-radius:999px;
  }
  .like-btn{
    position:absolute;
    left:12px;
    bottom:10px;
    display:flex;
    align-items:center;
    gap:5px;
    background:none;
    border:none;
    padding:4px;
    cursor:pointer;
  }
  .like-btn:hover{opacity:0.8;}
  .like-count{font-size:12.5px;font-weight:700;color:#233e2b;line-height:1;}
  .liked-list-card{padding-bottom:16px;}
  .liked-list-card .card-actions{position:static;display:inline-flex;margin-bottom:8px;}
  .liked-list-card .card-actions svg{width:24px;height:24px;}
  .song-card .card-actions{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    gap:2px;
  }
  .card-icon{
    width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
    color:var(--muted);
    font-size:14px;
  }
  .card-icon:hover{background:var(--surface-hover);color:var(--ink);}
  .card-icon.danger:hover{color:var(--danger);}

    color:var(--gold-strong);
    padding:8px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
  }

  /* ---------- REVISÃO DE CONTRIBUIÇÃO (comparar antes/depois) ---------- */
  .contrib-modal{max-width:640px;}
  .contrib-preview-meta{font-size:13px;color:var(--muted);margin-bottom:10px;}
  .contrib-sheet{max-height:260px;overflow-y:auto;padding:16px;font-size:14px;}
  .contrib-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .contrib-compare-label{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .contrib-links-list{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
  .contrib-link-row{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap;}
  .contrib-link-old{color:var(--muted);text-decoration:line-through;word-break:break-all;}
  .contrib-link-arrow{color:var(--leaf);}
  .contrib-link-new{color:var(--ink);font-weight:600;word-break:break-all;}

  /* ---------- ACERVO DE ACORDES ---------- */
  .chord-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .chord-filter-btn{
    padding:8px 14px;
    border-radius:999px;
    background:rgba(255,255,255,0.75);
    border:1px solid var(--border);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:500;
    white-space:nowrap;
  }
  .chord-filter-btn.active{background:var(--gold);color:#241505;border-color:var(--gold);}
  .chord-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:14px;
  }
  .chord-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:16px;
    text-align:center;
    box-shadow:0 6px 16px rgba(12,20,14,0.10);
  }
  .chord-card h3{margin:0 0 10px;font-size:19px;font-family:var(--font-serif);color:var(--ink);}
  .chord-diagram-wrap{display:flex;justify-content:center;margin:6px 0;}
  .chord-diagram-svg{display:block;}
  .chord-info{
    text-align:left;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.7;
    margin-top:8px;
    padding:0 4px;
  }
  .chord-info strong{color:var(--ink);}
  .chord-usage{
    margin-top:10px;
    font-size:12px;
    font-weight:600;
    color:var(--leaf);
    background:var(--leaf-soft);
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
  }
  .chord-diagram-missing{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:10px 6px;
  }
  .chord-diagram-missing-text{font-size:13px;font-weight:700;color:var(--danger);}
  .chord-diagram-missing-sub{font-size:11.5px;color:var(--muted);line-height:1.4;}
  .chord-tappable{cursor:pointer;}
  .chord-tappable:hover{background:rgba(199,154,46,0.32);}
  .chord-popup-box{text-align:center;max-width:280px;}
  .chord-popup-box h3{font-size:24px;margin:0 0 12px;font-family:var(--font-serif);color:var(--ink);}

  .chord-admin-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  .chord-admin-actions .btn-secondary{color:var(--ink);border-color:var(--border);font-size:12px;padding:6px 10px;}
  .chord-admin-actions .danger-text{color:var(--danger);border-color:var(--danger);}
  .chord-form-box{max-width:480px;text-align:left;}
  .chord-form-strings{display:flex;gap:6px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
  .chord-form-string-col{display:flex;flex-direction:column;align-items:center;gap:4px;width:52px;}
  .chord-form-string-col span{font-size:10px;color:var(--muted);text-align:center;}
  .chord-form-string-col input{width:100%;padding:6px 4px;text-align:center;font-size:13px;}
  .chord-form-barre-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .chord-form-barre-check input{width:auto;}
  .chord-form-barre-fields{display:flex;gap:8px;margin-bottom:14px;}
  .chord-form-barre-fields input{flex:1;}
  .chord-form-error{
    background:var(--danger-soft);
    border:1px solid var(--danger);
    color:var(--danger);
    font-size:12.5px;
    padding:8px 10px;
    border-radius:var(--radius-control);
    margin-bottom:12px;
  }

  /* ---------- CONSTRUTOR INTERATIVO DE ACORDES ---------- */
  .cb-panel{max-width:560px;margin:0 auto;}
  .cb-search{width:100%;text-align:center;font-size:16px;margin-bottom:20px;}
  .cb-builder-row{display:flex;gap:14px;align-items:flex-start;justify-content:center;}
  .cb-window-scroller{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    width:34px;
    flex:none;
    padding-top:26px;
  }
  .cb-window-btn{
    width:30px;height:26px;
    border-radius:8px;
    background:var(--surface-soft);
    border:1px solid var(--border);
    color:var(--ink-soft);
    font-size:11px;
  }
  .cb-window-btn:hover{border-color:var(--gold);color:var(--gold-strong);}
  .cb-window-track{
    position:relative;
    width:10px;
    flex:1;
    min-height:140px;
    background:var(--surface-soft);
    border:1px solid var(--border);
    border-radius:999px;
  }
  .cb-window-thumb{
    position:absolute;
    left:-3px;
    width:16px;
    height:36px;
    border-radius:999px;
    background:var(--gold);
    border:2px solid var(--gold-strong);
    transform:translateY(0);
  }
  .cb-fretboard{flex:1;min-width:0;max-width:340px;}
  .cb-string-labels{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    text-align:center;
    font-weight:700;
    color:var(--ink-soft);
    font-size:15px;
    margin-bottom:6px;
    padding-left:26px;
  }
  .cb-grid-wrap{
    position:relative;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--surface-soft);
  }
  .cb-fret-row{
    display:flex;
    align-items:stretch;
    border-bottom:1px solid var(--border);
    height:46px;
  }
  .cb-fret-row:last-child{border-bottom:none;}
  .cb-fret-num{
    width:26px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--muted);
    background:var(--surface);
    border-right:1px solid var(--border);
  }
  .cb-fret-cells{
    flex:1;
    display:grid;
    grid-template-columns:repeat(6,1fr);
  }
  .cb-cell{
    position:relative;
    border-right:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  .cb-cell:last-child{border-right:none;}
  .cb-cell:hover{background:var(--gold-soft);}
  .cb-cell-dragpreview{background:var(--gold-soft);}
  .cb-dot{
    width:24px;height:24px;
    border-radius:50%;
    background:#233e2b;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:12px;
    font-weight:700;
  }
  .cb-barre{
    position:absolute;
    height:22px;
    background:#233e2b;
    border-radius:11px;
    z-index:2;
    pointer-events:none;
    opacity:0.9;
  }
  .cb-mute-row{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    padding-left:26px;
    margin-top:8px;
  }
  .cb-mute-btn{
    height:28px;
    font-size:14px;
    font-weight:700;
    color:var(--danger);
    background:none;
    border:none;
  }
  .cb-mute-btn.cb-open{color:var(--leaf);}
  .cb-mute-btn.cb-blank{color:transparent;}
  .cb-error{
    background:var(--danger-soft);
    border:1px solid var(--danger);
    color:var(--danger);
    font-size:13px;
    padding:10px 12px;
    border-radius:var(--radius-control);
    margin:16px 0;
    text-align:center;
  }
  .cb-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;}
  .cb-actions .btn-secondary{color:var(--ink);border-color:var(--border);}
  @media (max-width:600px){
    .cb-fretboard{max-width:none;}
    .cb-cell .cb-dot{width:20px;height:20px;}
  }

  /* ---------- POP-UP DE BOAS-VINDAS / CONFIRMAÇÃO DE E-MAIL ---------- */
  .welcome-popup-box{
    max-width:440px;
    text-align:center;
    background:linear-gradient(180deg, var(--surface) 0%, var(--surface-soft) 100%);
    border:1px solid var(--gold);
    box-shadow:0 24px 60px rgba(0,0,0,0.4), 0 0 0 4px var(--gold-soft);
  }
  .welcome-popup-logo{width:64px;height:auto;margin:0 auto 14px;display:block;}
  .welcome-popup-box h3{
    font-family:var(--font-serif);
    font-size:22px;
    color:var(--ink);
    margin:0 0 14px;
  }
  .welcome-popup-box p{
    font-size:14px;
    line-height:1.65;
    color:var(--ink-soft);
    text-align:left;
    margin:0 0 16px;
  }
  .welcome-popup-highlight{
    background:var(--gold-soft);
    border:1px solid var(--gold);
    border-radius:14px;
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--gold-strong);
    font-weight:600;
    text-align:left;
    margin-bottom:18px;
  }
  .confirm-email-btn{
    background:var(--gold-soft);
    border-color:var(--gold);
    color:var(--gold-light);
  }

  @media (max-width:600px){
    .container{padding:20px 16px 100px;}
    .topbar{padding:14px 16px;}
    .paper{padding:18px 16px 14px;border-radius:16px;}
    .contrib-compare{grid-template-columns:1fr;}
    .chord-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  }
</style>

  function showConfirm(message){

      overlay.innerHTML = `
        <div class="confirm-box">
          <p>${escapeHtml(message)}</p>

      function cleanup(){ overlay.remove(); }

  function saveSessionToStorage(){

  function authedHeaders(){
    const token = (state.session && state.session.access_token) || SUPABASE_ANON_KEY;
    return {

      'Authorization': 'Bearer ' + token,

    };

  function authErrorMessage(data, fallback){
    if(!data) return fallback;
    return data.msg || data.error_description || data.error || fallback;
  }

  // fetch autenticado: se o token expirou (401), tenta renovar com o
  // refresh_token uma vez e refaz a chamada antes de desistir.
  async function authFetch(url, options){
    options = options || {};
    const headers = Object.assign({}, authedHeaders(), options.headers || {});
    options.headers = headers;
    let res = await fetch(url, options);
    if(res.status === 401 && state.session && state.session.refresh_token){
      try{
        const data = await apiRefreshToken(state.session.refresh_token);
        setSessionFromAuthResponse(data);
        headers['Authorization'] = 'Bearer ' + state.session.access_token;
        res = await fetch(url, options);
      }catch(e){
        await signOut();
        throw new Error('Sua sessão expirou. Entre novamente.');
      }
    }
    return res;
  }

  // Verifica se a URL veio de um link de e-mail do Supabase (recuperação de
  // senha ou confirmação de cadastro) antes de mostrar qualquer tela.
  function checkAuthRedirect(){
    const hash = window.location.hash;
    if(!hash || hash.indexOf('access_token')===-1) return false;
    const params = new URLSearchParams(hash.slice(1));
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    const type = params.get('type');
    if(!accessToken) return false;
    history.replaceState(null, '', window.location.pathname + window.location.search);
    if(type === 'recovery'){
      state._recoveryToken = accessToken;
      state._recoveryRefreshToken = refreshToken;
      state.view = 'resetPassword';
      return true;
    }
    state.session = { access_token: accessToken, refresh_token: refreshToken, user: null };
    saveSessionToStorage();
    state._pendingConfirmType = type; // 'signup' quando o link é de confirmação de e-mail
    return 'login-direct';
  }

  async function init(){
    try { state.sheetTheme = localStorage.getItem('cifrario_sheet_theme') || 'light'; } catch(e){}
    render(); // mostra a tela de carregamento imediatamente, antes de checar a sessão
    const redirectResult = checkAuthRedirect();
    if(redirectResult === true){ render(); return; }
    if(redirectResult === 'login-direct'){ await enterApp(); return; }
    const stored = loadSessionFromStorage();
    if(stored && stored.access_token){
      state.session = stored;
      try{
        await ensureUserInfo();
        await enterApp();
        return;
      }catch(e){
        try{
          const data = await apiRefreshToken(stored.refresh_token);
          setSessionFromAuthResponse(data);
          await ensureUserInfo();
          await enterApp();
          return;
        }catch(e2){
          state.session = null;
          saveSessionToStorage();
        }
      }
    }
    state.view = 'login';
    render();
  }

    const safeExp = exp || 0;
    const level = Math.floor(safeExp / XP_PER_LEVEL) + 1;
    const progress = safeExp % XP_PER_LEVEL;
    return { level, progress };
  }

  async function askDisplayName(){
    return new Promise(resolve=>{
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML = `
        <div class="confirm-box">
          <h3>Bem-vindo(a)!</h3>
          <p>Como você gostaria de ser chamado(a) no Acervo dos Rezos?</p>

          <div class="confirm-actions"><button class="btn-primary" data-choice="ok">Salvar</button></div>
        </div>`;
      document.body.appendChild(overlay);
      const inp = overlay.querySelector('#displayNameInput');
      setTimeout(()=>{ inp.focus(); }, 0);
      function submit(){

        overlay.remove();
        resolve(val);
      }
      overlay.querySelector('[data-choice="ok"]').addEventListener('click', submit);
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });

  // Compara o Exp atual com o último valor visto neste navegador; se subiu
  // (por uma contribuição aprovada pelo administrador), mostra o pop-up.
  function checkExpCelebration(){
    if(!state.profile || !state.session) return;
    const key = 'cifrario_seen_exp_' + state.session.user.id;
    let seenRaw = null;
    try { seenRaw = localStorage.getItem(key); } catch(e){}
    const currentExp = state.profile.exp || 0;
    if(seenRaw !== null){
      const seen = parseInt(seenRaw, 10) || 0;
      if(currentExp > seen) showExpCelebration(currentExp - seen, currentExp);
    }
    try { localStorage.setItem(key, String(currentExp)); } catch(e){}
  }

  function showExpCelebration(gained, totalExp){
    const { level, progress } = levelInfo(totalExp);
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box celebrate-box">
        <div class="celebrate-emoji">🎉</div>
        <h3>Parabéns!</h3>
        <p>Você ganhou <strong>+${gained} Exp de Rezo</strong> por suas contribuições aprovadas!</p>
        <div class="level-chip-big">Nível ${level} · ${progress}/100</div>
        <div class="confirm-actions"><button class="btn-primary" data-choice="ok">Show!</button></div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e=>{
      if(e.target===overlay || e.target.closest('[data-choice]')) overlay.remove();
    });
  }

  // Registra uma contribuição. Se quem contribuiu for o administrador, os
  // pontos são creditados na hora; para os demais, fica pendente de aprovação.
  // "payload" guarda o conteúdo exato da alteração, mostrado ao admin na aprovação.
  // Aplica de fato o conteúdo de uma contribuição na tabela pública de músicas
  // (só é chamada quando a contribuição é aprovada — na hora, se for o admin,
  // ou depois, quando o admin aprova a de outra pessoa).
  async function applySongPayload(kind, songId, payload){
    payload = payload || {};
    if(kind === 'new_manual' || kind === 'new_pdf'){
      const song = payload.after || {};
      await authFetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_SONGS_TABLE}?on_conflict=id`, {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{
          id: songId, title: song.title || '', artist: song.artist || '', tone: song.tone || '',
          theme: song.theme || '', links: song.links || {youtube:'',spotify:'',deezer:'',other:''},
          lines: song.lines || [], updated_at: new Date().toISOString()
        }])
      });
    } else if(kind === 'edit' || kind === 'chords_added'){
      const song = payload.after || {};
      await authFetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_SONGS_TABLE}?id=eq.${encodeURIComponent(songId)}`, {
        method: 'PATCH',
        body: JSON.stringify({
          title: song.title || '', artist: song.artist || '', tone: song.tone || '',
          theme: song.theme || '', lines: song.lines || [], updated_at: new Date().toISOString()
        })
      });
    } else if(kind === 'link'){
      const links = (payload.after && payload.after.links) || {};
      await authFetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_SONGS_TABLE}?id=eq.${encodeURIComponent(songId)}`, {
        method: 'PATCH',
        body: JSON.stringify({ links, updated_at: new Date().toISOString() })
      });
    } else if(kind === 'chord'){
      const c = payload.after || {};
      await authFetch(`${SUPABASE_URL}/rest/v1/cifrario_chords?on_conflict=id`, {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{
          id: c.dbId, name: c.name, normalized_name: c.normalized,
          root: c.root, quality: c.quality, bass: c.bass,
          strings: c.strings, fingers: c.fingers, barre: c.barre,
          validated: true, active: true, updated_at: new Date().toISOString()
        }])
      });
      CHORD_LIBRARY.register({ root: c.root, quality: c.quality, bass: c.bass, strings: c.strings, fingers: c.fingers, barre: c.barre, source: 'custom', dbId: c.dbId });
      _usedChordsCache = null;
    }
  }

  // Lê o Exp atual do usuário, soma os pontos e grava — devolve o novo total.
  async function creditExp(userId, points){
    const profRes = await authFetch(`${SUPABASE_URL}/rest/v1/cifrario_profiles?select=exp&id=eq.${userId}`);
    const profRows = await profRes.json();
    const currentExp = profRows.length ? (profRows[0].exp || 0) : 0;
    const newExp = currentExp + points;
    await authFetch(`${SUPABASE_URL}/rest/v1/cifrario_profiles?id=eq.${userId}`, { method: 'PATCH', body: JSON.stringify({ exp: newExp }) });
    return newExp;
  }

  // Registra uma contribuição. A alteração em si (a cifra nova/editada) só é
  // publicada no acervo quando aprovada — na hora, se quem contribuiu for o
  // administrador; depois, quando o administrador aprovar manualmente.
  // "payload" guarda o conteúdo exato da alteração, mostrado ao admin na aprovação.
  // "opts.silent" evita pop-up/toast individuais (usado em importações em lote).
  async function recordContribution(kind, points, song, payload, opts){
    if(!state.session || !isEditor() || points <= 0) return;
    const contribId = uid();
    const approved = isAdmin();
    const silent = !!(opts && opts.silent);
    try {
      await authFetch(`${SUPABASE_URL}/rest/v1/cifrario_contributions`, {
        method: 'POST',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify([{
          id: contribId, user_id: state.session.user.id, email: state.session.user.email,
          song_id: song ? song.id : null, song_title: song ? song.title : '',
          kind, points, status: approved ? 'approved' : 'pending', payload: payload || null
        }])
      });
      if(approved){
        await applySongPayload(kind, song.id, payload);
        const newExp = await creditExp(state.session.user.id, points);
        state.profile.exp = newExp;
        try { localStorage.setItem('cifrario_seen_exp_' + state.session.user.id, String(newExp)); } catch(e){}
        if(!silent){
          showExpCelebration(points, newExp);
          await loadSongs();
        }
      } else if(!silent){
        showToast('Contribuição enviada! Ela aparecerá no acervo assim que o administrador aprovar.');
      }
    } catch (e) {
      console.error('Erro ao registrar contribuição:', e);
    }
  }

  // Ajusta a contagem pública de curtidas de uma música (coluna like_count em
  // cifrario_songs). Atualiza o estado local na hora para resposta imediata.
  async function adjustLikeCount(songId, delta){
    const song = state.songs.find(s=>s.id===songId);
    const current = song ? (song.like_count || 0) : 0;
    const newCount = Math.max(0, current + delta);
    if(song) song.like_count = newCount;
    try {
      await authFetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_SONGS_TABLE}?id=eq.${encodeURIComponent(songId)}`, {
        method: 'PATCH', body: JSON.stringify({ like_count: newCount })
      });
    } catch (e) {
      console.error('Erro ao atualizar contagem de curtidas:', e);
    }
  }

    if(!requireConfirmedEmail()) return;
    state.editor = {
      id:null, title:'', artist:'', tone:'', theme:'', source:'manual',
      links:{youtube:'',spotify:'',deezer:'',other:''}, lines:[]
    };

  function goEditSong(id){
    if(!isEditor()){ showToast('Você precisa ser um editor aprovado para editar músicas.'); return; }
    if(!requireConfirmedEmail()) return;
    const song = state.songs.find(s=>s.id===id);
    if(!song) return;
    state.editor = {
      id: song.id,
      title: song.title,
      artist: song.artist,
      tone: song.tone || '',
      theme: song.theme || '',
      links: { ...(song.links || {youtube:'',spotify:'',deezer:'',other:''}) },
      lines: song.lines.map(l => ({ text: l.text, chords: l.chords.map(c=>({...c})) })),

  // Conta quantos acordes a música já tem anotados (soma de todas as linhas)
  // — usado pra decidir se mostra o convite "Adicionar acordes".
  function songChordCount(song){
    if(!song || !song.lines) return 0;
    return song.lines.reduce((total, l) => total + (l.chords ? l.chords.length : 0), 0);
  }

  function goAddChords(id){

  function openAddToListModal(songId){
    const song = state.songs.find(s=>s.id===songId);
    if(!song) return;
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    document.body.appendChild(overlay);

    function renderModal(){
      const rows = state.lists.map(l => `
        <label class="list-check-row">
          <input type="checkbox" data-list-id="${l.id}" ${isSongInList(l, songId) ? 'checked' : ''}>
          <span>${escapeHtml(l.name)}</span>
          <span class="list-check-count">${l.songIds.length} música${l.songIds.length===1?'':'s'}</span>
        </label>`).join('') || `<p class="muted-note">Você ainda não criou nenhuma lista. Crie uma abaixo.</p>`;
      overlay.innerHTML = `
        <div class="confirm-box">
          <h3>Adicionar "${escapeHtml(song.title)||'Sem título'}" a uma lista</h3>
          <div class="list-check-group">${rows}</div>
          <div class="new-list-row">

            <button class="btn-primary" id="createListBtn">Criar</button>
          </div>
          <div class="confirm-actions"><button class="btn-secondary" id="closeListsModalBtn" style="color:var(--ink);border-color:var(--border);">Concluído</button></div>
        </div>`;
      overlay.querySelectorAll('input[type=checkbox]').forEach(cb=>{
        cb.addEventListener('change', async ()=>{
          const list = state.lists.find(l=>l.id===cb.dataset.listId);
          if(!list) return;
          if(cb.checked && !requireConfirmedEmail()){ cb.checked = false; return; }
          await toggleSongInList(list, songId);
          showToast(isSongInList(list, songId) ? `Adicionada a "${list.name}".` : `Removida de "${list.name}".`);
          renderModal();
        });
      });
      const nameInput = overlay.querySelector('#newListNameInput');
      overlay.querySelector('#createListBtn').addEventListener('click', async ()=>{
        if(!requireConfirmedEmail()) return;
        const name = nameInput.value.trim();
        if(!name){ nameInput.focus(); return; }
        const list = { id: uid(), name, songIds: [songId] };
        state.lists.push(list);
        await persistList(list);
        showToast('Lista criada.');
        renderModal();
      });
      nameInput.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ e.preventDefault(); overlay.querySelector('#createListBtn').click(); }
      });
      overlay.querySelector('#closeListsModalBtn').addEventListener('click', ()=>{ overlay.remove(); render(); });
    }
    overlay.addEventListener('click', e=>{ if(e.target===overlay){ overlay.remove(); render(); } });
    renderModal();
  }

  // Renderiza o conteúdo exato de uma contribuição (o que foi escrito/alterado)
  // para o admin conferir antes de aprovar.
  function contributionDetailHtml(contrib){
    const payload = contrib.payload || {};
    if(contrib.kind === 'new_manual' || contrib.kind === 'new_pdf'){
      const song = payload.after || {};
      const metaBits = [];
      if(song.artist) metaBits.push(escapeHtml(song.artist));
      if(song.tone) metaBits.push('Tom: ' + escapeHtml(song.tone));
      if(song.theme) metaBits.push(escapeHtml(song.theme));
      const linesHtml = (song.lines || []).map(lineHtml).join('');
      return `
        ${metaBits.length ? `<div class="contrib-preview-meta">${metaBits.join(' · ')}</div>` : ''}
        <div class="paper sheet contrib-sheet">${linesHtml || '<p class="muted-note">Sem letra.</p>'}</div>
      `;
    }
    if(contrib.kind === 'edit' || contrib.kind === 'chords_added'){
      const before = payload.before || {};
      const after = payload.after || {};
      const beforeLines = (before.lines || []).map(lineHtml).join('');
      const afterLines = (after.lines || []).map(lineHtml).join('');
      return `
        <div class="contrib-compare">
          <div>
            <div class="contrib-compare-label">Antes</div>
            <div class="paper sheet contrib-sheet">${beforeLines || '<p class="muted-note">Sem conteúdo anterior.</p>'}</div>
          </div>
          <div>
            <div class="contrib-compare-label">Depois</div>
            <div class="paper sheet contrib-sheet">${afterLines || '<p class="muted-note">Sem conteúdo.</p>'}</div>
          </div>
        </div>
      `;
    }
    if(contrib.kind === 'link'){
      const before = (payload.before && payload.before.links) || {};
      const after = (payload.after && payload.after.links) || {};
      const labels = { youtube: 'YouTube', spotify: 'Spotify', deezer: 'Deezer', other: 'Outro link' };
      const rows = Object.keys(labels)
        .filter(k => (before[k] || '') !== (after[k] || ''))
        .map(k => `
          <div class="contrib-link-row">
            <strong>${labels[k]}</strong>
            <div class="contrib-link-old">${before[k] ? escapeHtml(before[k]) : '<em>vazio</em>'}</div>
            <div class="contrib-link-arrow">&#8594;</div>
            <div class="contrib-link-new">${after[k] ? escapeHtml(after[k]) : '<em>vazio</em>'}</div>
          </div>`).join('');
      return `<div class="contrib-links-list">${rows || '<p class="muted-note">Nenhuma alteração registrada.</p>'}</div>`;
    }
    if(contrib.kind === 'chord'){
      const c = payload.after || {};
      const def = { root: c.root, quality: c.quality, bass: c.bass, strings: c.strings, fingers: c.fingers, barre: c.barre, validated: true };
      return `
        <div class="contrib-preview-meta">Acorde: ${escapeHtml(c.name || '')}</div>
        ${renderChordDiagram(def, {size:'large'})}
      `;
    }
    return '<p class="muted-note">Sem detalhes disponíveis para esta contribuição.</p>';
  }

  /* ================= ACERVO DE ACORDES: TEORIA E PARSER ================= */
  // Notas em classes de altura (pitch class), C=0 ... B=11 — usado para
  // validar matematicamente se um diagrama produz as notas certas.
  const NOTE_TO_SEMITONE = {
    'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,'F#':6,'Gb':6,
    'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11
  };
  const NOTE_NAMES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const NOTE_NAMES_FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  // Cordas soltas do violão, afinação padrão, da 6ª (grave) para a 1ª (aguda).
  const OPEN_STRING_PC = [4,9,2,7,11,4]; // E A D G B E

  function enharmonicEquivalents(note){
    const semitone = NOTE_TO_SEMITONE[note];
    if(semitone === undefined) return [note];
    return Array.from(new Set([note, NOTE_NAMES_SHARP[semitone], NOTE_NAMES_FLAT[semitone]]));
  }

  // Tokens de qualidade/extensão reconhecidos, na ordem em que devem ser
  // testados (mais específicos primeiro, para "maj7" não virar "maj" + "7").
  const QUALITY_TOKENS = [
    'maj7','maj9','maj',
    'm7b5','m7','min7','m6','m9','m11','m13','madd9','min','m',
    'dim7','dim','°',
    'aug','+',
    'sus2','sus4',
    'add9','add11',
    '6/9','69',
    '13','11','9','7','6'
  ];
  // Nome canônico da qualidade (algumas grafias diferentes apontam pro mesmo acorde)
  const QUALITY_CANON = {
    'maj7':'maj7','maj9':'maj9','maj':'maj',
    'm7b5':'m7b5','m7':'m7','min7':'m7','m6':'m6','m9':'m9','m11':'m11','m13':'m13','madd9':'madd9','min':'m','m':'m',
    'dim7':'dim7','dim':'dim','°':'dim',
    'aug':'aug','+':'aug',
    'sus2':'sus2','sus4':'sus4',
    'add9':'add9','add11':'add11',
    '6/9':'6/9','69':'6/9',
    '13':'13','11':'11','9':'9','7':'7','6':'6'
  };
  // Intervalos (semitons a partir da fundamental) que definem cada qualidade —
  // usado por validateChordDefinition() para checar se o diagrama está correto.
  const QUALITY_INTERVALS = {
    'maj':[0,4,7], 'm':[0,3,7], '7':[0,4,7,10], 'm7':[0,3,7,10], 'maj7':[0,4,7,11],
    'dim':[0,3,6], 'dim7':[0,3,6,9], 'aug':[0,4,8],
    'sus2':[0,2,7], 'sus4':[0,5,7], 'add9':[0,4,7,2], 'madd9':[0,3,7,2],
    '6':[0,4,7,9], 'm6':[0,3,7,9], '9':[0,4,7,10,2], 'm9':[0,3,7,10,2],
    'maj9':[0,4,7,11,2], '11':[0,4,7,10,2,5], '13':[0,4,7,10,2,9],
    '6/9':[0,4,7,9,2], 'm7b5':[0,3,6,10], 'm11':[0,3,7,10,2,5], 'm13':[0,3,7,10,2,9]
  };

  /* ================= TRANSPOSIÇÃO DE TOM (só na visualização) ================= */
  // Escolhe sustenido ou bemol pra nota transposta com base no que a nota
  // ORIGINAL já usava — assim "Bb" transposto continua no estilo bemol, e
  // "F#" continua no estilo sustenido. A altura (pitch) é sempre a correta;
  // isso só decide COMO escrever, nunca muda qual nota realmente é.
  function pickEnharmonicSpelling(originalRoot, newPc){
    const usesFlat = originalRoot.length > 1 && originalRoot[1] === 'b';
    return usesFlat ? NOTE_NAMES_FLAT[newPc] : NOTE_NAMES_SHARP[newPc];
  }

  // Transpõe um texto de acorde (ou de tom) em N semitons, com o mínimo de
  // interpretação possível: só identifica a nota fundamental (e o baixo,
  // se houver) e desloca cada uma matematicamente — todo o resto do texto
  // (m7, add9, sus4, o que for) é preservado exatamente como foi digitado.
  // Se não conseguir nem reconhecer a fundamental com segurança, devolve o
  // texto original sem tocar em nada (nunca "inventa" uma transposição).
  function transposeChordName(chordText, steps){
    if(!steps || !chordText) return chordText;
    const s = String(chordText).trim();
    if(!s) return chordText;
    let main = s, bassRaw = null;
    const slashIdx = s.indexOf('/');
    if(slashIdx > 0){ main = s.slice(0, slashIdx); bassRaw = s.slice(slashIdx+1).trim(); }
    const rootMatch = /^([A-Ga-g])(#|b)?/.exec(main);
    if(!rootMatch) return chordText;
    const root = rootMatch[1].toUpperCase() + (rootMatch[2] || '');
    if(NOTE_TO_SEMITONE[root] === undefined) return chordText;
    const suffix = main.slice(rootMatch[0].length); // preserva exatamente o que vier depois da fundamental
    const newRootPc = ((NOTE_TO_SEMITONE[root] + steps) % 12 + 12) % 12;
    let result = pickEnharmonicSpelling(root, newRootPc) + suffix;
    if(bassRaw){
      const bassMatch = /^([A-Ga-g])(#|b)?$/.exec(bassRaw);
      if(bassMatch){
        const bassNote = bassMatch[1].toUpperCase() + (bassMatch[2] || '');
        if(NOTE_TO_SEMITONE[bassNote] !== undefined){
          const newBassPc = ((NOTE_TO_SEMITONE[bassNote] + steps) % 12 + 12) % 12;
          result += '/' + pickEnharmonicSpelling(bassNote, newBassPc);
        } else {
          result += '/' + bassRaw; // baixo não reconhecido — preserva original, não arrisca
        }
      } else {
        result += '/' + bassRaw;
      }
    }
    return result;
  }

  // Analisa um texto de acorde (ex.: "F#m7", "C/E", "Bb") e devolve sua
  // estrutura normalizada, ou null se o texto não for um acorde reconhecível
  // (protege contra palavras da letra virarem "acorde" por engano).
  function parseChordName(raw){
    if(!raw) return null;
    const s = String(raw).trim();
    if(!s) return null;
    let main = s, bass = null;
    const slashIdx = s.indexOf('/');
    if(slashIdx > 0){
      main = s.slice(0, slashIdx);
      const bassRaw = s.slice(slashIdx+1).trim();
      const bassMatch = /^([A-Ga-g])(#|b)?$/.exec(bassRaw);
      if(!bassMatch) return null;
      bass = bassMatch[1].toUpperCase() + (bassMatch[2]||'');
      if(NOTE_TO_SEMITONE[bass] === undefined) return null;
    }
    const rootMatch = /^([A-Ga-g])(#|b)?/.exec(main);
    if(!rootMatch) return null;
    const root = rootMatch[1].toUpperCase() + (rootMatch[2]||'');
    if(NOTE_TO_SEMITONE[root] === undefined) return null;
    const rest = main.slice(rootMatch[0].length).trim();
    let qualityKey = 'maj';
    if(rest){
      const restLower = rest.toLowerCase();
      const token = QUALITY_TOKENS.find(t => t.toLowerCase() === restLower);
      if(!token) return null; // sufixo não reconhecido -> não tratamos como acorde válido
      qualityKey = QUALITY_CANON[token];
    }
    const normalized = root + (qualityKey!=='maj' ? qualityKey : '') + (bass ? '/'+bass : '');
    return { root, quality: qualityKey, bass, normalized, original: s };
  }

  function normalizeChordName(raw){
    const parsed = parseChordName(raw);
    return parsed ? parsed.normalized : null;
  }

  // Confere matematicamente se uma definição de acorde produz as notas certas
  // nas cordas certas — só quem passa aqui pode ser marcado validated:true.
  function validateChordDefinition(def){
    if(!def || !Array.isArray(def.strings) || def.strings.length !== 6) return false;
    const rootPc = NOTE_TO_SEMITONE[def.root];
    if(rootPc === undefined) return false;
    const expectedOffsets = QUALITY_INTERVALS[def.quality];
    if(!expectedOffsets) return false;
    const expectedPCs = new Set(expectedOffsets.map(o => (rootPc + o) % 12));
    const bassPc = def.bass ? NOTE_TO_SEMITONE[def.bass] : null;
    if(def.bass && bassPc === undefined) return false;
    const produced = [];
    def.strings.forEach((fret, i) => {
      if(fret === null || fret === 'x' || fret === undefined) return;
      produced.push({ i, pc: (OPEN_STRING_PC[i] + fret) % 12 });
    });
    if(produced.length === 0) return false;
    for(const p of produced){
      if(expectedPCs.has(p.pc)) continue;
      if(bassPc !== null && p.pc === bassPc) continue;
      return false; // nota fora do que se espera para este acorde
    }
    if(!produced.some(p => p.pc === rootPc)) return false; // fundamental precisa soar
    if(def.bass){
      const lowest = produced[0]; // strings[0] é a 6ª corda (mais grave) — primeira tocada é o baixo real
      if(!lowest || lowest.pc !== bassPc) return false;
    }
    return true;
  }

  /* ================= ACERVO DE ACORDES: BIBLIOTECA CANÔNICA ================= */
  // Formas abertas conferidas nota a nota (ver relatório da implementação).
  // strings: índice 0 = 6ª corda (E grave) ... índice 5 = 1ª corda (E aguda).
  const OPEN_CHORDS = [
    { root:'C', quality:'maj', strings:['x',3,2,0,1,0], fingers:['x',3,2,0,1,0] },
    { root:'C', quality:'maj7', strings:['x',3,2,0,0,0], fingers:['x',3,2,0,0,0] },
    { root:'C', quality:'7', strings:['x',3,2,3,1,0], fingers:['x',3,2,4,1,0] },
    { root:'D', quality:'maj', strings:['x','x',0,2,3,2], fingers:['x','x',0,1,3,2] },
    { root:'D', quality:'m', strings:['x','x',0,2,3,1], fingers:['x','x',0,2,3,1] },
    { root:'D', quality:'7', strings:['x','x',0,2,1,2], fingers:['x','x',0,2,1,3] },
    { root:'D', quality:'maj7', strings:['x','x',0,2,2,2], fingers:['x','x',0,1,1,1], barre:{fret:2, from:3, to:5} },
    { root:'E', quality:'maj', strings:[0,2,2,1,0,0], fingers:[0,2,3,1,0,0] },
    { root:'E', quality:'m', strings:[0,2,2,0,0,0], fingers:[0,2,3,0,0,0] },
    { root:'E', quality:'7', strings:[0,2,0,1,0,0], fingers:[0,2,0,1,0,0] },
    { root:'E', quality:'m7', strings:[0,2,0,0,0,0], fingers:[0,2,0,0,0,0] },
    { root:'E', quality:'maj7', strings:[0,2,1,1,0,0], fingers:[0,3,1,2,0,0] },
    { root:'G', quality:'maj', strings:[3,2,0,0,0,3], fingers:[2,1,0,0,0,3] },
    { root:'G', quality:'7', strings:[3,2,0,0,0,1], fingers:[3,2,0,0,0,1] },
    { root:'G', quality:'maj7', strings:[3,2,0,0,0,2], fingers:[3,2,0,0,0,1] },
    { root:'A', quality:'maj', strings:['x',0,2,2,2,0], fingers:['x',0,1,2,3,0] },
    { root:'A', quality:'m', strings:['x',0,2,2,1,0], fingers:['x',0,2,3,1,0] },
    { root:'A', quality:'7', strings:['x',0,2,0,2,0], fingers:['x',0,1,0,2,0] },
    { root:'A', quality:'m7', strings:['x',0,2,0,1,0], fingers:['x',0,2,0,1,0] },
    { root:'A', quality:'maj7', strings:['x',0,2,1,2,0], fingers:['x',0,2,1,3,0] }
  ];

  // Formas-molde (pestana) verificadas a partir das formas abertas de E/Em/E7/
  // Em7/Emaj7 e A/Am/A7/Am7/Amaj7 acima — deslocar uma forma correta pelos
  // trastes é aritmética, não invenção: a nota fundamental muda, o desenho
  // (intervalos) continua o mesmo, e cada resultado ainda passa pela validação.
  const BARRE_SHAPES = {
    E: { // fundamental na 6ª corda solta
      root: 4, template: { 'maj':[0,2,2,1,0,0], 'm':[0,2,2,0,0,0], '7':[0,2,0,1,0,0], 'm7':[0,2,0,0,0,0], 'maj7':[0,2,1,1,0,0] }
    },
    A: { // fundamental na 5ª corda solta
      root: 9, template: { 'maj':[null,0,2,2,2,0], 'm':[null,0,2,2,1,0], '7':[null,0,2,0,2,0], 'm7':[null,0,2,0,1,0], 'maj7':[null,0,2,1,2,0] }
    }
  };

  function buildBarreChord(root, quality, shapeName){
    const shape = BARRE_SHAPES[shapeName];
    const tmpl = shape.template[quality];
    if(!tmpl) return null;
    const rootPc = NOTE_TO_SEMITONE[root];
    const fret = ((rootPc - shape.root) % 12 + 12) % 12;
    if(fret === 0) return null; // seria a própria forma aberta — já coberta acima
    const strings = tmpl.map(offset => offset === null ? 'x' : offset + fret);
    const fingerTemplates = {
      maj:[null,1,3,4,2,1], m:[null,1,3,4,1,1], '7':[null,1,3,1,2,1],
      m7:[null,1,3,1,1,1], maj7:[null,1,3,2,4,1]
    };
    const eFingerTemplates = {
      maj:[1,3,4,2,1,1], m:[1,3,4,1,1,1], '7':[1,3,1,2,1,1], m7:[1,3,1,1,1,1], maj7:[1,3,2,4,1,1]
    };
    const fingers = (shapeName==='E' ? eFingerTemplates[quality] : fingerTemplates[quality])
      .map(f => f===null ? 'x' : f);
    return {
      root, quality, strings, fingers,
      baseFret: fret,
      barre: { fret, from: shapeName==='E' ? 0 : 1, to: 5 }
    };
  }

  // Monta e valida a biblioteca inteira uma única vez, na carga da página.
  function buildChordLibrary(){
    const byKey = {};
    const all = [];
    function register(def){
      def.bass = def.bass || null;
      const key = def.root + (def.quality!=='maj' ? def.quality : '') + (def.bass ? '/'+def.bass : '');
      def.key = key;
      def.source = def.source || 'builtin';
      def.validated = validateChordDefinition(def);
      if(def.validated){
        byKey[key] = def;
        all.push(def);
      } else {
        console.warn('[Acervo de Acordes] diagrama reprovado na validação e descartado:', key, def);
      }
    }
    OPEN_CHORDS.forEach(register);
    const roots = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const qualities = ['maj','m','7','m7','maj7'];
    roots.forEach(root=>{
      qualities.forEach(quality=>{
        const key = root + (quality!=='maj' ? quality : '');
        if(byKey[key]) return; // já existe forma aberta verificada — não substitui
        const viaE = buildBarreChord(root, quality, 'E');
        const viaA = buildBarreChord(root, quality, 'A');
        // prefere o traste mais baixo (mais fácil/comum) entre as duas formas
        const candidate = [viaE, viaA].filter(Boolean).sort((a,b)=>a.baseFret-b.baseFret)[0];
        if(candidate) register(candidate);
      });
    });
    return { byKey, all, register };
  }
  const CHORD_LIBRARY = buildChordLibrary();

  // Mescla acordes cadastrados pelo administrador (tabela cifrario_chords) na
  // biblioteca em memória. Um acorde do banco só entra se passar pela mesma
  // validação matemática — e substitui a forma embutida da mesma chave (útil
  // para corrigir algo), mas nunca é aceito sem validated:true real.
  function mergeCustomChords(rows){
    (rows||[]).forEach(row=>{
      if(row.active === false) return;
      const def = {
        root: row.root, quality: row.quality || 'maj', bass: row.bass || null,
        strings: row.strings, fingers: row.fingers, barre: row.barre || null,
        source: 'custom', dbId: row.id
      };
      CHORD_LIBRARY.register(def);
      if(!def.validated){
        console.warn('[Acervo de Acordes] acorde cadastrado pelo admin não passou na validação e foi ignorado:', row.name);
      }
    });
  }

  async function loadCustomChords(){
    try {
      const res = await authFetch(`${SUPABASE_URL}/rest/v1/cifrario_chords?select=*&active=eq.true`);
      if(!res.ok) throw new Error('http-' + res.status);
      const rows = await res.json();
      mergeCustomChords(rows);
      _usedChordsCache = null; // força recálculo com a biblioteca atualizada
    } catch (e) {
      console.error('Erro ao carregar acordes cadastrados:', e);
    }
  }

  function getChordDefinition(parsed){
    if(!parsed) return null;
    for(const r of enharmonicEquivalents(parsed.root)){
      const key = r + (parsed.quality!=='maj' ? parsed.quality : '') + (parsed.bass ? '/'+parsed.bass : '');
      if(CHORD_LIBRARY.byKey[key]) return CHORD_LIBRARY.byKey[key];
    }
    return null;
  }

  /* ================= ACERVO DE ACORDES: ACORDES USADOS NO ACERVO ================= */
  // Fonte única de verdade: varre state.songs -> lines -> chords, normaliza,
  // remove duplicidade e conta o uso. Cache simples invalidado por assinatura
  // (recalcula só quando o conjunto de músicas realmente muda).
  let _usedChordsCache = null;
  let _usedChordsSignature = null;
  function getUsedChords(){
    const signature = state.songs.length + ':' + state.songs.map(s=>s.id).join(',');
    if(_usedChordsCache && _usedChordsSignature === signature) return _usedChordsCache;
    const seen = new Map();
    state.songs.forEach(song=>{
      (song.lines||[]).forEach(line=>{
        (line.chords||[]).forEach(c=>{
          const parsed = parseChordName(c.chord);
          if(!parsed) return;
          const key = parsed.normalized;
          if(!seen.has(key)) seen.set(key, { label: (c.chord||'').trim(), parsed, count: 0, songIds: new Set() });
          const entry = seen.get(key);
          entry.count++;
          entry.songIds.add(song.id);
        });
      });
    });
    const result = Array.from(seen.values())
      .map(e => ({ key: e.parsed.normalized, label: e.label, parsed: e.parsed, count: e.songIds.size, def: getChordDefinition(e.parsed) }))
      .sort((a,b)=> a.label.localeCompare(b.label, 'pt-BR', {numeric:true}));
    _usedChordsCache = result;
    _usedChordsSignature = signature;
    return result;
  }

  /* ================= ACERVO DE ACORDES: TESTES INTERNOS ================= */
  // Roda uma vez ao carregar a página; só registra no console (não trava o
  // app se algo falhar — é uma rede de segurança para quem for mexer no código).
  function runChordSystemTests(){
    const checks = [];
    function t(desc, cond){ checks.push({ desc, ok: !!cond }); }
    t('C reconhecido como C', parseChordName('C') && parseChordName('C').normalized==='C');
    t('Cm reconhecido como Cm', parseChordName('Cm') && parseChordName('Cm').normalized==='Cm');
    t('C7 reconhecido como C7', parseChordName('C7') && parseChordName('C7').normalized==='C7');
    t('Cmaj7 reconhecido', parseChordName('Cmaj7') && parseChordName('Cmaj7').normalized==='Cmaj7');
    t('Cadd9 reconhecido', parseChordName('Cadd9') && parseChordName('Cadd9').normalized==='Cadd9');
    t('C/E reconhecido', parseChordName('C/E') && parseChordName('C/E').normalized==='C/E');
    t('Bb reconhecido', parseChordName('Bb') && parseChordName('Bb').normalized==='Bb');
    t('A# tratado como enarmônico de Bb', getChordDefinition(parseChordName('A#')) === getChordDefinition(parseChordName('Bb')) || (!getChordDefinition(parseChordName('A#')) && !getChordDefinition(parseChordName('Bb'))));
    t('"Casa" não vira acorde', parseChordName('Casa') === null);
    t('"blablabla" não vira acorde', parseChordName('blablabla') === null);
    t('acorde com espaços é normalizado', parseChordName(' Am ') && parseChordName(' Am ').normalized==='Am');
    t('acorde minúsculo é normalizado', parseChordName('am') && parseChordName('am').normalized==='Am');
    (function(){
      const def = getChordDefinition(parseChordName('Am'));
      t('Am tem diagrama validado', !!(def && def.validated));
    })();
    (function(){
      const def = getChordDefinition(parseChordName('Xyz9999'));
      t('acorde inexistente não recebe diagrama inventado', def === undefined || def === null);
    })();
    (function(){
      const fake = { root:'C', quality:'maj', strings:[0,0,0,0,0,0] }; // notas erradas de propósito
      t('validador rejeita diagrama musicalmente incorreto', validateChordDefinition(fake) === false);
    })();
    (function(){
      const real = getChordDefinition(parseChordName('G7'));
      t('validador aprova diagrama correto (G7)', !!(real && validateChordDefinition(real)));
    })();
    const failed = checks.filter(c=>!c.ok);
    if(failed.length){
      console.warn('[Acervo de Acordes] testes falharam:', failed.map(f=>f.desc));
    } else {
      console.log('[Acervo de Acordes] todos os ' + checks.length + ' testes internos passaram.');
    }
    return checks;
  }

  /* ================= ACERVO DE ACORDES: DIAGRAMA VISUAL ================= */
  // Componente reutilizável — usado no Acervo, no popup e em qualquer lugar
  // que precise mostrar a posição de um acorde no braço do violão.
  function renderChordDiagram(def, opts){
    opts = opts || {};
    const size = opts.size === 'large' ? 220 : 150;
    const W = 160, H = 190;
    const nStrings = 6, nFrets = 4;
    const left = 22, top = 34, right = 138, bottom = 174;
    const stringGap = (right-left)/(nStrings-1);
    const fretGap = (bottom-top)/nFrets;

    if(!def){
      return `
        <div class="chord-diagram-missing" style="width:${size}px;">
          <svg viewBox="0 0 ${W} ${H}" width="${size}" height="${size*(H/W)}"><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="34">🎸</text></svg>
          <div class="chord-diagram-missing-text">Diagrama ainda não cadastrado</div>
          <div class="chord-diagram-missing-sub">Este acorde foi encontrado no acervo, mas ainda não possui uma posição de violão validada.</div>
        </div>`;
    }

    const frets = def.strings.map(f => f==='x' ? 'x' : f);
    const numericFrets = frets.filter(f=>f!=='x' && f>0);
    const maxFret = numericFrets.length ? Math.max(...numericFrets) : 0;
    const minFret = numericFrets.length ? Math.min(...numericFrets) : 0;
    // se a posição usa trastes altos, desloca a "janela" mostrada e indica a casa inicial
    const baseFret = (def.barre && def.barre.fret > 0) ? def.barre.fret : (minFret > 1 ? minFret : 1);
    const showBaseLabel = baseFret > 1;

    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${size}" height="${size*(H/W)}" class="chord-diagram-svg">`;
    // trastes (linhas horizontais)
    for(let i=0;i<=nFrets;i++){
      const y = top + i*fretGap;
      svg += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#233e2b" stroke-width="${i===0 && baseFret===1 ? 3 : 1.4}"/>`;
    }
    // cordas (linhas verticais)
    for(let i=0;i<nStrings;i++){
      const x = left + i*stringGap;
      svg += `<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="#233e2b" stroke-width="1.2"/>`;
    }
    // pestana
    if(def.barre){
      const fromX = left + def.barre.from*stringGap;
      const toX = left + def.barre.to*stringGap;
      const fretIdx = (def.barre.fret - baseFret) + 1;
      const y = top + (fretIdx-0.5)*fretGap;
      svg += `<line x1="${fromX}" y1="${y}" x2="${toX}" y2="${y}" stroke="#233e2b" stroke-width="10" stroke-linecap="round" opacity="0.85"/>`;
    }
    // indicação da casa inicial
    if(showBaseLabel){
      svg += `<text x="${left-14}" y="${top+fretGap*0.65}" font-size="13" fill="#233e2b" text-anchor="middle" font-weight="700">${baseFret}ª</text>`;
    }
    // marcadores por corda: X / O / dedo
    frets.forEach((f, i) => {
      const x = left + i*stringGap;
      if(f === 'x'){
        svg += `<text x="${x}" y="${top-14}" font-size="15" fill="#233e2b" text-anchor="middle" font-weight="700">×</text>`;
      } else if(f === 0){
        svg += `<circle cx="${x}" cy="${top-16}" r="6" fill="white" stroke="#233e2b" stroke-width="2"/>`;
      } else if(typeof f === 'number'){
        const relativeFret = f - baseFret + 1;
        const y = top + (relativeFret-0.5)*fretGap;
        const finger = def.fingers && def.fingers[i] && def.fingers[i]!=='x' ? def.fingers[i] : '';
        const isBarreDot = def.barre && f===def.barre.fret;
        if(!isBarreDot || i===def.barre.from || i===def.barre.to){
          svg += `<circle cx="${x}" cy="${y}" r="9" fill="#233e2b"/>`;
          if(finger !== '') svg += `<text x="${x}" y="${y+4}" font-size="11" fill="white" text-anchor="middle" font-weight="700">${finger}</text>`;
        }
      }
    });
    svg += `</svg>`;
    return `<div class="chord-diagram-wrap">${svg}</div>`;
  }

  function chordNotesLabel(def){
    if(!def) return '';
    const rootPc = NOTE_TO_SEMITONE[def.root];
    const intervals = QUALITY_INTERVALS[def.quality] || [0];
    const names = Array.from(new Set(intervals.map(o => NOTE_NAMES_SHARP[(rootPc+o)%12])));
    return names.join(' ');
  }

  function chordFingersLabel(def){
    if(!def || !def.fingers) return '—';
    const used = def.fingers.filter(f=>f && f!=='x').map(Number);
    if(!used.length) return 'nenhum (cordas soltas)';
    return Array.from(new Set(used)).sort().join(', ');
  }

  function chordCategoryOf(quality){
    if(quality==='m'||quality==='m6'||quality==='m7'||quality==='m9'||quality==='m11'||quality==='m13'||quality==='madd9') return 'menores';
    if(quality==='7'||quality==='9'||quality==='11'||quality==='13'||quality==='m7'||quality==='maj7'||quality==='maj9'||quality==='m7b5') return 'setima';
    if(quality==='sus2'||quality==='sus4') return 'suspensos';
    if(quality==='maj') return 'maiores';
    return 'outros';
  }

  /* ================= ACERVO DE ACORDES: TELA ================= */
  function chordCardHtml(entry){
    const def = entry.def;
    const admin = isAdmin();
    const editor = isEditor();

            <div><strong>Posição:</strong> ${def.barre && def.barre.fret>1 ? def.barre.fret+'ª casa' : 'primeira posição'}</div>
            <div><strong>Notas:</strong> ${chordNotesLabel(def)}</div>
            <div><strong>Dedos:</strong> ${chordFingersLabel(def)}</div>

        <div class="chord-usage">Usado em ${entry.count} cifra${entry.count===1?'':'s'}</div>
        ${(editor || admin) ? `
          <div class="chord-admin-actions">

            ${def && def.source==='custom' && admin ? `

            ` : ''}

  function renderChordLibrary(){
    const q = (state.chordSearch||'').trim().toLowerCase();
    const filter = state.chordFilter || 'todos';
    let entries = getUsedChords();
    if(q) entries = entries.filter(e => e.label.toLowerCase().includes(q));
    if(filter !== 'todos'){
      entries = entries.filter(e => {
        const cat = chordCategoryOf(e.parsed.quality);
        if(filter==='maiores') return cat==='maiores';
        if(filter==='menores') return cat==='menores';
        if(filter==='setima') return cat==='setima';
        if(filter==='suspensos') return cat==='suspensos';
        if(filter==='outros') return cat==='outros';
        return true;
      });
    }
    const cards = entries.map(chordCardHtml).join('');
    const empty = getUsedChords().length===0
      ? `<div class="empty-state"><div class="big">Nenhum acorde encontrado ainda.</div><div>Assim que as cifras do acervo tiverem acordes, eles aparecem aqui automaticamente.</div></div>`
      : `<div class="empty-state"><div class="big">Nenhum acorde encontrado com esse filtro.</div></div>`;
    const filters = [
      ['todos','Todos'], ['maiores','Maiores'], ['menores','Menores'],
      ['setima','Com 7ª'], ['suspensos','Suspensos'], ['outros','Outros']
    ];
    return `
      <header class="topbar">
        <button class="topbar-back" data-action="back">&#8592; Acervo</button>
        <div class="song-title-block"><h1>🎸 Acervo de Acordes</h1><span>Explore os acordes utilizados nas cifras do acervo</span></div>
        ${isEditor() ? `<div class="topbar-actions"><button class="icon-btn" data-action="goChordBuilder" data-chord="">+ Criar novo acorde</button></div>` : ''}
      </header>
      <main class="container">
        <input id="chordSearchInput" class="search" style="margin-bottom:14px;" placeholder="Buscar acorde..." value="${escapeHtml(state.chordSearch||'')}">

        <div class="chord-grid">${cards || empty}</div>
      </main>

  /* ================= ACERVO DE ACORDES: ADMINISTRAÇÃO DE DIAGRAMAS ================= */
  async function deactivateChord(dbId){
    if(!isAdmin()) return;
    const ok = await showConfirm('Desativar este diagrama? Ele deixará de aparecer no Acervo de Acordes.');
    if(!ok) return;
    try {
      await authFetch(`${SUPABASE_URL}/rest/v1/cifrario_chords?id=eq.${encodeURIComponent(dbId)}`, { method: 'PATCH', body: JSON.stringify({ active: false }) });
      for(const key in CHORD_LIBRARY.byKey){
        if(CHORD_LIBRARY.byKey[key].dbId === dbId) delete CHORD_LIBRARY.byKey[key];
      }
      CHORD_LIBRARY.all = CHORD_LIBRARY.all.filter(d => d.dbId !== dbId);
      _usedChordsCache = null;
      showToast('Diagrama desativado.');
      render();
    } catch (e) {
      console.error('Erro ao desativar diagrama:', e);
      showToast('Não foi possível desativar o diagrama.');
    }
  }


  /* ================= ACERVO DE ACORDES: CONSTRUTOR INTERATIVO ================= */
  const CB_WINDOW_SIZE = 5;
  const CB_MAX_FRET = 15;
  const CB_STRING_LABELS = ['E','A','D','G','B','E'];
  let chordBuilderState = null;
  let chordBuilderDrag = null;
  let cbSearchDebounce = null;

  function cbBlankState(prefillText){
    return {
      chordText: prefillText || '',
      windowStart: 1,
      strings: ['x','x','x','x','x','x'],
      fingers: ['','','','','',''],
      barre: null,
      placementOrder: [], // ordem em que os dedos individuais foram clicados
      editDbId: null
    };
  }

  // Reconstrói a numeração 1-4 a partir do zero, sempre que algo muda: a
  // pestana (quando existir) é sempre o dedo 1; os demais pontos recebem o
  // próximo número disponível, na ordem em que foram clicados.
  function cbRenumberFingers(){
    const st = chordBuilderState;
    st.fingers = ['','','','','',''];
    const barreStrings = new Set();
    if(st.barre){
      for(let i=st.barre.from;i<=st.barre.to;i++){
        if(st.strings[i] === st.barre.fret){
          st.fingers[i] = '1';
          barreStrings.add(i);
        }
      }
    }
    st.placementOrder = st.placementOrder.filter(i => typeof st.strings[i] === 'number' && !barreStrings.has(i));
    let nextFinger = st.barre ? 2 : 1;
    st.placementOrder.forEach(i=>{
      st.fingers[i] = String(Math.min(nextFinger, 4));
      nextFinger++;
    });
  }

  // Reconstrói a ordem de cliques a partir de dedos já salvos (ao carregar um
  // acorde existente pela busca ou para editar), pra numeração continuar
  // coerente se a pessoa mexer no diagrama depois.
  function cbRebuildPlacementOrder(){
    const st = chordBuilderState;
    const barreStrings = new Set();
    if(st.barre) for(let i=st.barre.from;i<=st.barre.to;i++) barreStrings.add(i);
    st.placementOrder = [0,1,2,3,4,5]
      .filter(i => !barreStrings.has(i) && typeof st.strings[i] === 'number')
      .sort((a,b) => (parseInt(st.fingers[a],10)||99) - (parseInt(st.fingers[b],10)||99));
    cbRenumberFingers();
  }

  function goChordBuilder(prefillText, editKey){
    if(!isEditor()){ showToast('Você precisa ser um editor aprovado para cadastrar acordes.'); return; }
    if(!requireConfirmedEmail()) return;
    const existing = editKey ? CHORD_LIBRARY.byKey[editKey] : null;
    if(existing){
      chordBuilderState = {
        chordText: prefillText || '',
        windowStart: (existing.barre && existing.barre.fret > CB_WINDOW_SIZE) ? Math.max(1, existing.barre.fret - 2) : 1,
        strings: existing.strings.slice(),
        fingers: (existing.fingers || ['','','','','','']).slice(),
        barre: existing.barre ? { ...existing.barre } : null,
        placementOrder: [],
        editDbId: existing.dbId || null
      };
      cbRebuildPlacementOrder();
    } else {
      chordBuilderState = cbBlankState(prefillText);
    }
    state.view = 'chordBuilder';
    render();
  }

  function cbShiftWindow(delta){
    chordBuilderState.windowStart = Math.max(1, Math.min(CB_MAX_FRET - CB_WINDOW_SIZE + 1, chordBuilderState.windowStart + delta));
    renderChordBuilderPartial();
  }

  function cbToggleOpenMute(stringIdx){
    const st = chordBuilderState;
    const cur = st.strings[stringIdx];
    st.strings[stringIdx] = (cur === 'x') ? 0 : 'x';
    st.placementOrder = st.placementOrder.filter(i=>i!==stringIdx);
    cbRenumberFingers();
    renderChordBuilderPartial();
  }

  function cbToggleDot(stringIdx, fret){
    const st = chordBuilderState;
    if(st.strings[stringIdx] === fret){
      st.strings[stringIdx] = 'x';
      st.placementOrder = st.placementOrder.filter(i=>i!==stringIdx);
    } else {
      st.strings[stringIdx] = fret;
      if(st.placementOrder.indexOf(stringIdx)===-1) st.placementOrder.push(stringIdx);
    }
    cbRenumberFingers();
    renderChordBuilderPartial();
  }

  function cbClear(){
    const text = chordBuilderState.chordText;
    const editDbId = chordBuilderState.editDbId;
    chordBuilderState = cbBlankState(text);
    chordBuilderState.editDbId = editDbId;
    renderChordBuilderPartial();
  }

  function cbGridPointerDown(e){
    const cell = e.target.closest('.cb-cell');
    if(!cell) return;
    e.preventDefault();
    const stringIdx = parseInt(cell.dataset.string, 10);
    const fret = parseInt(cell.dataset.fret, 10);
    chordBuilderDrag = { startString: stringIdx, fret, currentString: stringIdx };
  }
  function cbGridPointerMove(e){
    if(!chordBuilderDrag) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const cell = el && el.closest && el.closest('.cb-cell');
    if(!cell) return;
    const fret = parseInt(cell.dataset.fret, 10);
    if(fret !== chordBuilderDrag.fret) return; // pestana só é criada dentro da mesma casa
    const stringIdx = parseInt(cell.dataset.string, 10);
    if(stringIdx !== chordBuilderDrag.currentString){
      chordBuilderDrag.currentString = stringIdx;
      cbPreviewBarreDrag();
    }
  }
  function cbGridPointerUp(){
    if(!chordBuilderDrag) return;
    const { startString, fret, currentString } = chordBuilderDrag;
    chordBuilderDrag = null;
    if(startString === currentString){
      cbToggleDot(startString, fret);
    } else {
      const from = Math.min(startString, currentString);
      const to = Math.max(startString, currentString);
      chordBuilderState.barre = { fret, from, to };
      for(let i=from;i<=to;i++) chordBuilderState.strings[i] = fret;
      cbRenumberFingers();
      renderChordBuilderPartial();
    }
  }
  function cbPreviewBarreDrag(){
    // feedback visual leve durante o arraste, sem alterar o estado ainda
    const grid = document.getElementById('cbFretboard');
    if(!grid) return;
    grid.querySelectorAll('.cb-cell').forEach(c=>c.classList.remove('cb-cell-dragpreview'));
    const { startString, currentString, fret } = chordBuilderDrag;
    const from = Math.min(startString, currentString), to = Math.max(startString, currentString);
    for(let i=from;i<=to;i++){
      const cell = grid.querySelector(`.cb-cell[data-string="${i}"][data-fret="${fret}"]`);
      if(cell) cell.classList.add('cb-cell-dragpreview');
    }
  }

  function cbWindowScrollerHtml(){
    const st = chordBuilderState;
    const range = CB_MAX_FRET - CB_WINDOW_SIZE;
    const pct = range > 0 ? ((st.windowStart-1)/range)*100 : 0;
    return `
      <div class="cb-window-scroller">
        <button class="cb-window-btn" data-action="cbShiftUp" title="Casas mais baixas">&#9650;</button>
        <div class="cb-window-track">
          <div class="cb-window-thumb" style="top:${pct}%;"></div>
        </div>
        <button class="cb-window-btn" data-action="cbShiftDown" title="Casas mais altas">&#9660;</button>
      </div>`;
  }

  function renderChordBuilderGrid(){
    const st = chordBuilderState;
    const rows = [];
    for(let f=0; f<CB_WINDOW_SIZE; f++){
      const absFret = st.windowStart + f;
      let cells = '';
      for(let s=0; s<6; s++){
        const active = st.strings[s] === absFret;
        cells += `<div class="cb-cell ${active?'cb-cell-on':''}" data-string="${s}" data-fret="${absFret}">${active ? `<span class="cb-dot">${escapeHtml(st.fingers[s]||'')}</span>` : ''}</div>`;
      }
      rows.push(`<div class="cb-fret-row"><span class="cb-fret-num">${absFret}</span><div class="cb-fret-cells">${cells}</div></div>`);
    }
    let barreHtml = '';
    if(st.barre && st.barre.fret >= st.windowStart && st.barre.fret < st.windowStart+CB_WINDOW_SIZE){
      const rowIndex = st.barre.fret - st.windowStart;
      const pctFrom = (st.barre.from/6)*100;
      const pctWidth = ((st.barre.to-st.barre.from+1)/6)*100;
      barreHtml = `<div class="cb-barre" style="top:calc(${rowIndex} * (100% / ${CB_WINDOW_SIZE}) + 4px); left:${pctFrom}%; width:${pctWidth}%;"></div>`;
    }
    const muteOpenRow = st.strings.map((v,i)=>{
      if(v==='x') return `<button class="cb-mute-btn" data-action="cbToggleMute" data-string="${i}">×</button>`;
      if(v===0) return `<button class="cb-mute-btn cb-open" data-action="cbToggleMute" data-string="${i}">O</button>`;
      return `<button class="cb-mute-btn cb-blank" data-action="cbToggleMute" data-string="${i}"></button>`;
    }).join('');
    return `
      <div class="cb-string-labels">${CB_STRING_LABELS.map(l=>`<span>${l}</span>`).join('')}</div>
      <div class="cb-grid-wrap" id="cbGridWrap">
        ${barreHtml}
        ${rows.join('')}
      </div>
      <div class="cb-mute-row">${muteOpenRow}</div>
    `;
  }

  function renderChordBuilderPartial(){
    const grid = document.getElementById('cbFretboard');
    if(grid) grid.innerHTML = renderChordBuilderGrid();
    const scrollerHost = document.getElementById('cbScrollerHost');
    if(scrollerHost) scrollerHost.innerHTML = cbWindowScrollerHtml();
  }

  function renderChordBuilder(){
    const st = chordBuilderState;
    return `
      <header class="topbar">
        <button class="topbar-back" data-action="back">&#8592; Acervo de Acordes</button>
        <div class="song-title-block"><h1>Criar / editar acorde</h1></div>
      </header>
      <main class="container">
        <div class="paper cb-panel">
          <input id="cbSearchInput" class="search cb-search" placeholder="Digite o acorde (ex.: Em7, D/F#, Cadd9)" value="${escapeHtml(st.chordText)}">
          <div class="cb-builder-row">
            <div id="cbScrollerHost">${cbWindowScrollerHtml()}</div>
            <div class="cb-fretboard" id="cbFretboard">${renderChordBuilderGrid()}</div>
          </div>
          <div class="cb-error" id="cbError" style="display:none;"></div>
          <div class="cb-actions">
            <button class="btn-secondary" data-action="cbClear">Limpar</button>
            <button class="btn-primary" data-action="cbSave">Salvar acorde</button>
          </div>
          <p class="modal-sub" style="text-align:center;margin-top:14px;">
            Clique numa corda/casa para marcar um dedo — a numeração (1 a 4) é feita sozinha, na ordem em que você clica, então clique sempre na ordem real dos dedos (indicador, médio, anelar, mindinho) para a forma ficar correta.
            Arraste de uma corda até outra na mesma casa para criar uma pestana — ela sempre conta como dedo 1.
            Use o × abaixo de cada corda para alternar entre "não tocada" e "corda solta".
          </p>
        </div>
      </main>
      ${brandWatermark()}
    `;
  }

  async function cbSave(){
    if(!isEditor()){ showToast('Você precisa ser um editor aprovado para cadastrar acordes.'); return; }
    if(!requireConfirmedEmail()) return;
    const errorEl = document.getElementById('cbError');
    errorEl.style.display = 'none';
    const chordText = chordBuilderState.chordText.trim();
    const parsed = parseChordName(chordText);
    if(!parsed){
      errorEl.textContent = 'Digite um nome de acorde válido (ex.: Em7, D/F#, Cadd9).';
      errorEl.style.display = 'block';
      return;
    }
    const candidate = {
      root: parsed.root, quality: parsed.quality, bass: parsed.bass,
      strings: chordBuilderState.strings, fingers: chordBuilderState.fingers, barre: chordBuilderState.barre
    };
    if(!validateChordDefinition(candidate)){
      errorEl.textContent = 'Essa posição não produz as notas corretas para ' + chordText + '. Confira os dedos marcados.';
      errorEl.style.display = 'block';
      return;
    }
    const dbId = chordBuilderState.editDbId || uid();
    const payload = { after: {
      dbId, name: chordText, normalized: parsed.normalized,
      root: parsed.root, quality: parsed.quality, bass: parsed.bass,
      strings: candidate.strings, fingers: candidate.fingers, barre: candidate.barre
    }};
    await recordContribution('chord', 10, { id: null, title: chordText }, payload);
    showToast(isAdmin() ? 'Acorde salvo e publicado!' : 'Acorde enviado! Ele entra no acervo assim que o administrador aprovar.');
    goChordLibrary();
  }

  /* ================= RENDER ROOT ================= */
  function render(){
    const app = document.getElementById('app');
    if(state.view!=='view') removeSpeedVBar();
    if(state.view==='login'){ app.innerHTML = renderLogin(); afterRender(); return; }
    if(state.view==='signup'){ app.innerHTML = renderSignup(); afterRender(); return; }
    if(state.view==='forgot'){ app.innerHTML = renderForgotPassword(); afterRender(); return; }
    if(state.view==='resetPassword'){ app.innerHTML = renderResetPassword(); afterRender(); return; }
    if(!state.session || !state.loaded){ app.innerHTML = renderLoadingScreen(); return; }
    if(state.view==='list') app.innerHTML = renderList();
    else if(state.view==='lists') app.innerHTML = renderLists();
    else if(state.view==='listDetail') app.innerHTML = renderListDetail();
    else if(state.view==='view') app.innerHTML = renderSongView(state.songs.find(s=>s.id===state.currentId));
    else if(state.view==='editMeta') app.innerHTML = renderEditMeta();
    else if(state.view==='editChords') app.innerHTML = renderEditChords();
    else if(state.view==='admin') app.innerHTML = renderAdmin();
    else if(state.view==='profileInfo') app.innerHTML = renderProfileInfo();
    else if(state.view==='chordLibrary') app.innerHTML = renderChordLibrary();
    else if(state.view==='chordBuilder') app.innerHTML = renderChordBuilder();
    afterRender();
  }

  /* ---- arrastar para reordenar músicas dentro de uma lista ---- */
  let listDrag = null;
  function beginListDrag(e){
    if(state.view !== 'listDetail') return;
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const row = handle.closest('.list-song-row');
    if(!row) return;
    const list = state.lists.find(l=>l.id===state.currentListId);
    if(!list) return;
    e.preventDefault();
    listDrag = { list, draggingId: row.dataset.songId, pointerId: e.pointerId };
    row.classList.add('dragging-row');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  }
  function onListDragMove(e){
    if(!listDrag || e.pointerId !== listDrag.pointerId) return;
    const container = document.getElementById('listSongRows');
    if(!container) return;
    const rows = Array.from(container.querySelectorAll('.list-song-row'));
    const list = listDrag.list;
    const currentIndex = list.songIds.indexOf(listDrag.draggingId);
    for(const r of rows){
      if(r.dataset.songId === listDrag.draggingId) continue;
      const rect = r.getBoundingClientRect();
      const mid = rect.top + rect.height/2;
      const otherIndex = list.songIds.indexOf(r.dataset.songId);
      if(otherIndex<0) continue;
      if(e.clientY < mid && otherIndex < currentIndex){
        list.songIds.splice(currentIndex,1);
        list.songIds.splice(otherIndex,0,listDrag.draggingId);
        renderListDetailRows();
        break;
      } else if(e.clientY > mid && otherIndex > currentIndex){
        list.songIds.splice(currentIndex,1);
        list.songIds.splice(otherIndex,0,listDrag.draggingId);
        renderListDetailRows();
        break;
      }
    }
  }
  function onListDragEnd(e){
    if(!listDrag || e.pointerId !== listDrag.pointerId) return;
    const { list } = listDrag;
    listDrag = null;
    persistList(list);
    renderListDetailRows();
  }

      const displayChord = steps ? transposeChordName(c.chord, steps) : c.chord;
      return `<span class="chord chord-tappable" data-action="showChordPopup" data-chord="${escapeHtml(displayChord)}" style="left:${c.pos}ch">${escapeHtml(displayChord)}</span>`;
    }).join('');
    return `<div class="line">
      <div class="chords-row">${chordsHtml}</div>
      <div class="lyrics-row">${escapeHtml(line.text) || '&nbsp;'}</div>
    </div>`;
