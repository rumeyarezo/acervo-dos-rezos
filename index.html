  // Calcula um tamanho de fonte que faça a linha mais longa da cifra (letra
  // ou posição de acorde) caber na largura da tela, sem cortar palavras nem
  // precisar de rolagem horizontal — mantém o alinhamento porque cifra e
  // letra usam a mesma fonte monoespaçada e escalam juntas.
  // A largura real de um caractere é medida (em vez de estimada), e não há
  // piso mínimo de tamanho: se a linha for muito longa, a fonte encolhe o
  // quanto for preciso para caber 100% da largura sem arrastar a tela.
  let _monoCharWidthPerPx = null;
  function getMonoCharWidthPerPx(){
    if(_monoCharWidthPerPx) return _monoCharWidthPerPx;
    const probe = document.createElement('span');
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    probe.style.whiteSpace = 'pre';
    probe.style.fontFamily = getComputedStyle(document.querySelector('.sheet .lyrics-row') || document.body).fontFamily || 'monospace';
    probe.style.fontSize = '100px';
    probe.textContent = '0'.repeat(50);
    document.body.appendChild(probe);
    const width = probe.getBoundingClientRect().width;
    document.body.removeChild(probe);
    _monoCharWidthPerPx = width > 0 ? (width / 50) / 100 : 0.6; // largura por caractere, por px de font-size
    return _monoCharWidthPerPx;
  }

  function fitSheetFontSize(){
    const sheet = document.querySelector('.sheet');
    if(!sheet) return;
    const song = state.songs.find(s=>s.id===state.currentId);
    if(!song || !song.lines || !song.lines.length) return;
    let maxChars = 1;
    song.lines.forEach(l=>{
      maxChars = Math.max(maxChars, (l.text||'').length);
      (l.chords||[]).forEach(c=>{ maxChars = Math.max(maxChars, c.pos + (c.chord||'').length); });
    });
    const availableWidth = sheet.clientWidth - 8;
    if(availableWidth <= 0) return;
    const charWidthPerPx = getMonoCharWidthPerPx();
    let fontSize = Math.floor(availableWidth / (maxChars * charWidthPerPx));
    fontSize = Math.max(1, Math.min(16, fontSize));
    sheet.style.setProperty('--sheet-font-size', fontSize + 'px');
  }

  /* ================= EDITOR: CHORD PLACEMENT ================= */
  function editorLineHtml(line, i, ed){
    const isActive = i === ed.activeLine;
    const chordsHtml = line.chords.map((c,ci) =>
      `<span class="chord" data-line-index="${i}" data-chord-index="${ci}" style="left:${c.pos}ch">${escapeHtml(c.chord)}</span>`
    ).join('');
    const caretHtml = isActive && !ed.popupOpen ? `<span class="caret" style="left:${ed.cursorPos}ch"></span>` : '';
    const popupHtml = isActive && ed.popupOpen ?
      `<input id="chordPopupInput" class="chord-popup" style="left:${ed.cursorPos}ch" value="${escapeHtml(ed.popupValue)}" placeholder="Am">` : '';

  /* ================= EDITOR ACTIONS ================= */
  function goToChords(){
    const ed = state.editor;
    const title = document.getElementById('titleInput').value.trim();
    const artist = document.getElementById('artistInput').value.trim();
    const toneEl = document.getElementById('toneInput');
    const themeEl = document.getElementById('themeInput');
    ed.tone = toneEl ? toneEl.value.trim() : (ed.tone||'');
    ed.theme = themeEl ? themeEl.value.trim().replace(/\s+/g,'') : (ed.theme||'');
    const raw = document.getElementById('lyricsTextarea').value;
    const newLinesText = raw.split('\n');
    const oldLines = ed.lines || [];
    const newLines = newLinesText.map((text,i) => {
      const old = oldLines[i];
      if(old && old.chords && old.chords.length){
        // Mantém as cifras da mesma linha mesmo que o texto tenha mudado
        // (ex.: corrigir um typo), só ajustando a posição ao novo tamanho.
        const chords = old.chords.map(c => ({
          ...c,
          pos: Math.max(0, Math.min(text.length, c.pos))
        }));
        return { text, chords };
      }
      return { text, chords: [] };
    });
    ed.title = title;
    ed.artist = artist;
    ed.lines = newLines;
    ed.activeLine = 0;
    ed.cursorPos = 0;
    ed.popupOpen = false;
    ed.popupValue = '';
    state.view = 'editChords';
    render();
  }

  async function reeditText(){
    const ed = state.editor;
    if(ed.lines.some(l=>l.chords.length>0)){
      const ok = await showConfirm('As cifras ficam vinculadas à posição de cada linha. Se você adicionar ou remover linhas de texto, as cifras podem acabar na linha errada — mas só editar o texto (corrigir palavras, por exemplo) não afeta as cifras. Deseja continuar?');
      if(!ok) return;
    }
    state.view = 'editMeta';
    render();
  }

  function cancelEdit(){
    state.editor = null;
    if(state.currentId) goView(state.currentId); else goList();
  }

  async function finishEdit(){
    const ed = state.editor;
    const titleEl = document.getElementById('titleInline') || document.getElementById('titleInput');
    const artistEl = document.getElementById('artistInline') || document.getElementById('artistInput');
    const title = (titleEl ? titleEl.value : ed.title).trim() || 'Sem título';
    const artist = (artistEl ? artistEl.value : ed.artist).trim();
    const isNewSong = !ed.id;
    const oldSong = !isNewSong ? state.songs.find(s=>s.id===ed.id) : null;
    const oldSnapshot = oldSong ? {
      title: oldSong.title, artist: oldSong.artist, tone: oldSong.tone,
      theme: oldSong.theme, lines: JSON.parse(JSON.stringify(oldSong.lines))
    } : null;
    const song = {
      id: ed.id || uid(),
      title, artist,
      tone: (ed.tone||'').trim(),
      theme: (ed.theme||'').trim(),
      links: ed.links || {youtube:'',spotify:'',deezer:'',other:''},
      lines: ed.lines.map(l => ({ text: l.text, chords: [...l.chords].sort((a,b)=>a.pos-b.pos) }))
    };
    // A alteração só é publicada no acervo quando aprovada (na hora, se for o
    // admin; senão, quando o admin aprovar depois) — por isso não mexemos em
    // state.songs nem persistimos a música aqui: quem faz isso é recordContribution.
    const newSnapshot = { title: song.title, artist: song.artist, tone: song.tone, theme: song.theme, lines: song.lines };
    if(isNewSong){
      const dup = findDuplicateSong(song.title, song.artist);
      if(dup){
        const ok = await showConfirm(`Já existe uma cifra chamada "${song.title}" de ${song.artist || 'artista não informado'} no acervo. Deseja enviar esta mesmo assim?`);
        if(!ok){
          showToast('Envio cancelado.');
          return;
        }
      }
      const points = ed.source === 'pdf' ? 30 : 50;
      const kind = ed.source === 'pdf' ? 'new_pdf' : 'new_manual';
      await recordContribution(kind, points, song, { after: newSnapshot });
    } else {
      if(ed.source === 'add_chords'){
        await recordContribution('chords_added', 30, song, { before: oldSnapshot, after: newSnapshot });
      } else {
        await recordContribution('edit', 10, song, { before: oldSnapshot, after: newSnapshot });
      }
    }
    state.editor = null;
    if(isAdmin()){
      showToast('Música salva.');
      goView(song.id);
    } else if(isNewSong){
      showToast('Cifra enviada! Ela aparecerá no acervo assim que o administrador aprovar.');
      goList();
    } else {
      showToast('Edição enviada! As mudanças aparecerão assim que o administrador aprovar.');
      goView(oldSong.id);
    }
  }

  async function deleteSong(id){
    if(!isEditor()){ showToast('Você precisa ser um editor aprovado para excluir músicas.'); return; }
    if(!requireConfirmedEmail()) return;
    const song = state.songs.find(s=>s.id===id);
    if(!song) return;
    const ok = await showConfirm(`Excluir "${song.title}"? Essa ação não pode ser desfeita.`);
    if(!ok) return;
    state.songs = state.songs.filter(s=>s.id!==id);
    // remove a música de qualquer lista personalizada que a contenha
    state.lists.forEach(l=>{
      const before = l.songIds.length;
      l.songIds = l.songIds.filter(sid=>sid!==id);
      if(l.songIds.length !== before) persistList(l);
    });
    await removeSongRemote(id);
    state.favoriteIds.delete(id);
    state.openMenuId = null;
    if(state.editor && state.editor.id === id) state.editor = null;
    if(state.currentId===id || (state.view==='editChords' || state.view==='editMeta')) goList(); else render();
  }

  /* ---- cursor / chord placement ---- */
  function activeLine(){ return state.editor.lines[state.editor.activeLine]; }

  function moveCursor(delta){

    const line = activeLine();
    ed.cursorPos = Math.max(0, Math.min(line.text.length, ed.cursorPos + delta));
    renderEditorSheetOnly();

  function changeActiveLine(delta){
    const ed = state.editor;
    const newIndex = Math.max(0, Math.min(ed.lines.length-1, ed.activeLine + delta));
    ed.activeLine = newIndex;
    ed.cursorPos = Math.min(ed.cursorPos, ed.lines[newIndex].text.length);

  function confirmChordPopup(){
    const ed = state.editor;
    const inp = document.getElementById('chordPopupInput');
    const val = inp ? inp.value.trim() : '';
    if(val){
      const line = activeLine();
      const existingIdx = line.chords.findIndex(c=>c.pos===ed.cursorPos);
      if(existingIdx>=0) line.chords[existingIdx].chord = val;
      else line.chords.push({ pos: ed.cursorPos, chord: val });
      line.chords.sort((a,b)=>a.pos-b.pos);

  function removeChordAtCursor(){

    const line = activeLine();
    const idx = line.chords.findIndex(c=>c.pos===ed.cursorPos);
    if(idx>=0) line.chords.splice(idx,1);

  function focusSheet(){
    const sheet = document.getElementById('editorSheet');
    if(sheet) sheet.focus();
  }

  function getChWidth(){
    if(chWidthCache) return chWidthCache;
    const span = document.createElement('span');
    span.style.fontFamily = "'JetBrains Mono', monospace";
    span.style.fontSize = '16px';
    span.style.position = 'absolute';
    span.style.visibility = 'hidden';
    span.textContent = 'M'.repeat(40);
    document.body.appendChild(span);
    chWidthCache = span.getBoundingClientRect().width / 40;
    document.body.removeChild(span);
    return chWidthCache;
  }

  /* ---- arrastar acordes já inseridos com o mouse (clicar e segurar) ---- */
  let chordDrag = null;
  function onChordPointerDown(e){
    if(state.view !== 'editChords') return;
    const el = e.target.closest('.chord');
    if(!el) return;
    e.preventDefault();
    e.stopPropagation();
    const lineIndex = parseInt(el.dataset.lineIndex, 10);
    const chordIndex = parseInt(el.dataset.chordIndex, 10);
    const line = state.editor.lines[lineIndex];
    const chord = line && line.chords[chordIndex];
    if(!chord) return;
    chordDrag = {
      el, lineIndex, chordIndex,
      startX: e.clientX,
      startPos: chord.pos,
      currentPos: chord.pos,
      maxPos: line.text.length,
      chWidth: getChWidth(),
      pointerId: e.pointerId
    };
    el.classList.add('dragging');
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  }
  function onChordPointerMove(e){
    if(!chordDrag || e.pointerId !== chordDrag.pointerId) return;
    const deltaPx = e.clientX - chordDrag.startX;
    const deltaCh = deltaPx / chordDrag.chWidth;
    let newPos = Math.round(chordDrag.startPos + deltaCh);
    newPos = Math.max(0, Math.min(chordDrag.maxPos, newPos));
    chordDrag.currentPos = newPos;
    chordDrag.el.style.left = newPos + 'ch';
  }
  function onChordPointerUp(e){
    if(!chordDrag || e.pointerId !== chordDrag.pointerId) return;
    const { lineIndex, chordIndex, currentPos, el } = chordDrag;
    el.classList.remove('dragging');
    try{ el.releasePointerCapture(e.pointerId); }catch(err){}
    const line = state.editor && state.editor.lines[lineIndex];
    if(line && line.chords[chordIndex]) line.chords[chordIndex].pos = currentPos;
    chordDrag = null;
    renderEditorSheetOnly();
  }

  /* ================= PDF IMPORT ================= */
  function isChordToken(tok){
    if(!tok) return false;
    if(/[a-z]{4,}/.test(tok)) return false; // long lowercase run -> a real word, not a chord
    return /^\(?[A-G](#|b)?[A-Za-z0-9°ºmM\/\(\)\+\-]*\)?$/.test(tok);
  }

  function groupTextIntoRows(items){
    const rows = [];
    const tolerance = 2.5;
    items.forEach(it=>{
      if(!it.str || !it.str.trim()) return;
      let row = rows.find(r=>Math.abs(r.y - it.y) <= tolerance);
      if(!row){ row = { y: it.y, items: [] }; rows.push(row); }
      row.items.push(it);
    });
    rows.forEach(r=> r.items.sort((a,b)=>a.x-b.x));
    rows.sort((a,b)=> b.y - a.y);
    return rows;
  }

  function rowText(row){ return row.items.map(it=>it.str.trim()).join(' ').trim(); }

  function rowIsChordRow(row){
    const toks = row.items.map(it=>it.str.trim()).filter(Boolean);
    return toks.length>0 && toks.every(isChordToken);
  }

  async function extractPdfRows(file){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let allItems = [];
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      content.items.forEach(it=>{
        if(!it.str || !it.str.trim()) return;
        allItems.push({
          str: it.str,
          x: it.transform[4],
          y: it.transform[5] - p*10000, // offset each page so rows never merge across pages
          width: it.width || (it.str.length * (Math.abs(it.transform[0])||6))
        });
      });
    }
    return groupTextIntoRows(allItems);
  }

  function buildSongFromRows(rows){
    rows = rows.filter(r=>rowText(r).length>0);
    if(rows.length===0) return null;

    let title = '', artist = '', tone = '';
    let titleFound = false, artistFound = false;
    const metaRegex = /^(Tom|Afina[cç][aã]o|Composi[cç][aã]o de|Capotraste)\s*:/i;
    const bodyRows = [];

    rows.forEach(r=>{
      const txt = rowText(r);
      const toneMatch = txt.match(/^Tom\s*:\s*(.+)$/i);
      if(toneMatch){ tone = toneMatch[1].trim(); return; }
      if(metaRegex.test(txt)) return;
      if(/^cifraclub$/i.test(txt)) return;
      if(!titleFound && !rowIsChordRow(r)){ title = txt; titleFound = true; return; }
      if(titleFound && !artistFound && !rowIsChordRow(r)){ artist = txt; artistFound = true; return; }
      bodyRows.push(r);
    });

    const ys = bodyRows.map(r=>r.y);
    const gaps = [];
    for(let i=1;i<ys.length;i++) gaps.push(ys[i-1]-ys[i]);
    gaps.sort((a,b)=>a-b);
    const lineStep = gaps.length ? gaps[Math.floor(gaps.length/2)] : 14;
    const fallbackCharWidth = 7;

    const lines = [];
    let pending = null;

    function flushInstrumental(){
      if(!pending) return;
      const x0 = pending.chords[0].x;
      const chords = pending.chords.map(c=>({
        pos: Math.max(0, Math.round((c.x - x0)/fallbackCharWidth)),
        chord: c.str
      }));
      lines.push({ text:'', chords });
      pending = null;
    }

    let prevY = null;
    bodyRows.forEach(row=>{
      if(prevY!==null && (prevY - row.y) > lineStep*1.6){
        flushInstrumental();
        lines.push({text:'', chords:[]});
      }
      if(rowIsChordRow(row)){
        flushInstrumental();
        pending = { chords: row.items.map(it=>({str:it.str.trim(), x:it.x})) };
      } else {
        const text = rowText(row);
        const x0 = row.items[0].x;
        const lastItem = row.items[row.items.length-1];
        const totalWidth = (lastItem.x + lastItem.width) - x0;
        const charWidth = text.length>0 ? Math.max(totalWidth / text.length, 3) : fallbackCharWidth;
        let chords = [];
        if(pending){
          chords = pending.chords.map(c=>({
            pos: Math.max(0, Math.min(text.length, Math.round((c.x - x0)/charWidth))),
            chord: c.str
          })).sort((a,b)=>a.pos-b.pos);
          pending = null;
        }
        lines.push({ text, chords });
      }
      prevY = row.y;
    });
    flushInstrumental();

    return { title, artist, tone, lines };
  }

  let pdfjsReadyPromise = null;
  function ensurePdfJs(){
    if(pdfjsReadyPromise) return pdfjsReadyPromise;
    pdfjsReadyPromise = new Promise((resolve, reject)=>{
      if(window.pdfjsLib){ resolve(); return; }
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = ()=>{
        // O aviso "Setting up fake worker" é só um aviso de desempenho: neste
        // tipo de iframe isolado, o navegador costuma bloquear a criação de um
        // Worker real a partir de um script de outra origem, então o pdf.js
        // processa o PDF na thread principal em vez de num worker separado.
        // A importação continua funcionando normalmente, só um pouco mais lenta.
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        resolve();
      };
      s.onerror = ()=> reject(new Error('load-failed'));
      document.head.appendChild(s);
    });
    return pdfjsReadyPromise;
  }

  async function handlePdfFile(file){
    if(!isEditor()){ showToast('Você precisa ser um editor aprovado para importar PDFs.'); return; }
    if(!requireConfirmedEmail()) return;
    showToast('Lendo o PDF...');
    try {
      await ensurePdfJs();
      const rows = await extractPdfRows(file);
      const parsed = buildSongFromRows(rows);
      if(!parsed || parsed.lines.length===0){
        showToast('Não consegui ler o conteúdo desse PDF.');
        return;
      }
      state.editor = {
        id: null,
        title: parsed.title,
        artist: parsed.artist,
        tone: parsed.tone,
        theme: '', // fica em branco — pode ser preenchido depois em "Editar texto, tom ou tema"
        source: 'pdf',
        links: {youtube:'',spotify:'',deezer:'',other:''},
        lines: parsed.lines,
        activeLine: 0,
        cursorPos: 0,
        popupOpen: false,
        popupValue: ''
      };
      state.view = 'editChords';
      render();
      showToast('Cifra importada — confira o posicionamento das notas. O tema ficou em branco, edite quando quiser.');
    } catch(e){
      console.error('Erro ao importar PDF:', e);
      showToast('Não foi possível importar esse PDF: ' + (e && e.message ? e.message : 'erro desconhecido'));
    }
  }

  // Importação em lote: cada PDF vira uma contribuição própria automaticamente
  // (sem passar pela tela de edição individual). Continua exigindo aprovação
  // do administrador, exceto quando quem importa é o próprio administrador.
  async function handlePdfFilesBatch(files){
    if(!isEditor()){ showToast('Você precisa ser um editor aprovado para importar PDFs.'); return; }
    if(!requireConfirmedEmail()) return;
    showToast(`Lendo ${files.length} arquivos...`);
    try { await ensurePdfJs(); } catch(e){
      showToast('Não foi possível carregar o leitor de PDF.');
      return;
    }
    let successCount = 0, failCount = 0, skippedCount = 0, totalPoints = 0;
    const queuedKeys = new Set(); // título+artista já aceitos nesta leva
    for(const file of files){
      try {
        const rows = await extractPdfRows(file);
        const parsed = buildSongFromRows(rows);
        if(!parsed || parsed.lines.length===0){ failCount++; continue; }
        const key = (parsed.title||'').trim().toLowerCase() + '|' + (parsed.artist||'').trim().toLowerCase();
        const isDup = !!findDuplicateSong(parsed.title, parsed.artist) || queuedKeys.has(key);
        if(isDup){
          const ok = await showConfirm(`"${parsed.title || 'Sem título'}" de ${parsed.artist || 'artista não informado'} já existe no acervo (ou já foi enviada nesta leva). Enviar mesmo assim?`);
          if(!ok){ skippedCount++; continue; }
        }
        queuedKeys.add(key);
        const song = {
          id: uid(), title: parsed.title, artist: parsed.artist, tone: parsed.tone || '',
          theme: '', links: {youtube:'',spotify:'',deezer:'',other:''}, lines: parsed.lines
        };
        const snapshot = { title: song.title, artist: song.artist, tone: song.tone, theme: song.theme, lines: song.lines };
        await recordContribution('new_pdf', 30, song, { after: snapshot }, { silent: true });
        successCount++;
        totalPoints += 30;
      } catch(err){
        console.error('Erro ao importar PDF em lote:', file.name, err);
        failCount++;
      }
    }
    if(isAdmin() && totalPoints > 0){
      await loadSongs();
      showExpCelebration(totalPoints, state.profile.exp);
    }
    showToast(`Importação concluída: ${successCount} cifra${successCount===1?'':'s'} enviada${successCount===1?'':'s'}${skippedCount ? `, ${skippedCount} ignorada${skippedCount===1?'':'s'} por serem repetidas` : ''}${failCount ? `, ${failCount} com erro` : ''}.`);
    render();
  }

  /* ================= AUTOSCROLL ================= */
  let speedVBarDragging = false;

  function setSpeedFromTrackClientY(clientY){
    const track = document.getElementById('speedVBarTrack');
    if(!track) return;
    const rect = track.getBoundingClientRect();
    let ratio = (rect.bottom - clientY) / rect.height; // 0 embaixo, 1 em cima
    ratio = Math.max(0, Math.min(1, ratio));
    state.autoScroll.speed = Math.round(1 + ratio * 99); // 1..100
    updateSpeedVBarUI();
    syncSpeedControlsExternal();
  }

  function onSpeedVBarPointerDown(e){
    speedVBarDragging = true;
    setSpeedFromTrackClientY(e.clientY);
    e.preventDefault();
  }
  function onSpeedVBarPointerMove(e){
    if(!speedVBarDragging) return;
    setSpeedFromTrackClientY(e.clientY);
  }
  function onSpeedVBarPointerUp(){ speedVBarDragging = false; }

  function createSpeedVBar(){
    if(document.getElementById('speedVBar')) return;
    const bar = document.createElement('div');
    bar.id = 'speedVBar';
    bar.className = 'speed-vbar';
    bar.innerHTML = `<div class="speed-vbar-track" id="speedVBarTrack">
        <div class="speed-vbar-fill" id="speedVBarFill"></div>
        <div class="speed-vbar-thumb" id="speedVBarThumb"></div>
      </div>`;
    const iconTop = document.createElement('div');
    iconTop.className = 'speed-vbar-icon top';
    iconTop.id = 'speedVBarIconTop';
    iconTop.textContent = '⚡';
    const iconBottom = document.createElement('div');
    iconBottom.className = 'speed-vbar-icon bottom';
    iconBottom.id = 'speedVBarIconBottom';
    iconBottom.textContent = '🐢';
    document.body.appendChild(bar);
    document.body.appendChild(iconTop);
    document.body.appendChild(iconBottom);
    bar.addEventListener('pointerdown', onSpeedVBarPointerDown);
    window.addEventListener('pointermove', onSpeedVBarPointerMove);
    window.addEventListener('pointerup', onSpeedVBarPointerUp);
    updateSpeedVBarUI();
  }

  function removeSpeedVBar(){
    const bar = document.getElementById('speedVBar');
    if(bar) bar.remove();
    const iconTop = document.getElementById('speedVBarIconTop');
    if(iconTop) iconTop.remove();
    const iconBottom = document.getElementById('speedVBarIconBottom');
    if(iconBottom) iconBottom.remove();
    window.removeEventListener('pointermove', onSpeedVBarPointerMove);
    window.removeEventListener('pointerup', onSpeedVBarPointerUp);
    speedVBarDragging = false;
  }

  function updateSpeedVBarUI(){
    const fill = document.getElementById('speedVBarFill');
    const thumb = document.getElementById('speedVBarThumb');
    if(!fill || !thumb) return;
    const pct = Math.max(1, Math.min(100, state.autoScroll.speed));
    fill.style.height = pct + '%';
    thumb.style.bottom = pct + '%';
  }

  // Mantém a barra vertical e o slider do popup de leitura sincronizados,
  // não importa qual dos dois controles o usuário está mexendo.
  function syncSpeedControlsExternal(){
    const slider = document.getElementById('speedSliderModal');
    const label = document.getElementById('speedValueModal');
    if(slider) slider.value = state.autoScroll.speed;
    if(label) label.textContent = state.autoScroll.speed + '%';
  }

  function startAutoScroll(){
    // Quem rola de fato é a página (o #scrollContainer não tem overflow/altura
    // própria), então a rolagem automática precisa mexer no scroll da janela.
    state.autoScroll.active = true;
    let scrollAccumulator = 0; // guarda a fração de pixel entre os quadros
    function step(){
      if(!state.autoScroll.active) return;
      // Em velocidades baixas, menos de 1px por quadro seria arredondado para 0
      // e a tela nunca se moveria. Acumulamos a fração até ela virar 1px real,
      // garantindo rolagem suave em qualquer velocidade, mesmo bem lenta.
      scrollAccumulator += speedToPx(state.autoScroll.speed);
      const pixels = Math.floor(scrollAccumulator);
      if(pixels >= 1){
        window.scrollBy(0, pixels);
        scrollAccumulator -= pixels;
      }
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if(window.scrollY >= maxScroll - 2){
        state.autoScroll.active = false;
        updatePlayToggleUI();
        removeSpeedVBar();
        return;
      }
      scrollRAF = requestAnimationFrame(step);
    }
    scrollRAF = requestAnimationFrame(step);
    updatePlayToggleUI();
    createSpeedVBar();
  }
  function stopAutoScroll(){
    state.autoScroll.active = false;
    if(scrollRAF) cancelAnimationFrame(scrollRAF);
    scrollRAF = null;
    updatePlayToggleUI();
    removeSpeedVBar();
  }
  function updatePlayToggleUI(){
    const fab = document.querySelector('.autoscroll-fab');
    if(fab){
      fab.classList.toggle('active', state.autoScroll.active);
      fab.innerHTML = state.autoScroll.active ? '&#10074;&#10074;' : '&#9654;';
    }
    const modalBtn = document.getElementById('playToggleModal');
    if(modalBtn){
      modalBtn.classList.toggle('active', state.autoScroll.active);
      const icon = document.getElementById('playIconModal');
      if(icon) icon.innerHTML = state.autoScroll.active ? '&#10074;&#10074;' : '&#9654;';
    }
  }

  /* ================= EVENT WIRING ================= */
  function afterRender(){
    if(state.view==='login' || state.view==='signup' || state.view==='forgot'){
      const submitMap = { login: signIn, signup: signUp, forgot: requestPasswordReset };
      const emailEl = document.getElementById('authEmail');
      const passEl = document.getElementById('authPassword');
      [emailEl, passEl].forEach(el=>{
        if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitMap[state.view](); } });
      });
      if(emailEl) emailEl.focus();
    }
    if(state.view==='resetPassword'){
      const pw = document.getElementById('newPasswordInput');
      if(pw){
        pw.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitNewPassword(); } });
        pw.focus();
      }
    }
    if(state.view==='list'){
      const s = document.getElementById('searchInput');
      if(s) s.addEventListener('input', e=>{ state.search = e.target.value; render(); const el=document.getElementById('searchInput'); if(el){ el.focus(); el.selectionStart = el.value.length; } });
      const fa = document.getElementById('filterArtist');
      if(fa) fa.addEventListener('change', e=>{ state.filterArtist = e.target.value; render(); });
      const ft = document.getElementById('filterTheme');
      if(ft) ft.addEventListener('change', e=>{ state.filterTheme = e.target.value; render(); });
    }
    if(state.view==='view'){
      requestAnimationFrame(fitSheetFontSize);
    }
    if(state.view==='editMeta'){
      const themeEl = document.getElementById('themeInput');
      if(themeEl) themeEl.addEventListener('input', e=>{ e.target.value = e.target.value.replace(/\s/g,''); });
    }
    if(state.view==='chordLibrary'){
      const cs = document.getElementById('chordSearchInput');
      if(cs) cs.addEventListener('input', e=>{ state.chordSearch = e.target.value; render(); const el=document.getElementById('chordSearchInput'); if(el){ el.focus(); el.selectionStart = el.value.length; } });
    }
    if(state.view==='chordBuilder'){
      const cbInput = document.getElementById('cbSearchInput');
      if(cbInput){
        cbInput.addEventListener('input', e=>{
          chordBuilderState.chordText = e.target.value;
          clearTimeout(cbSearchDebounce);
          cbSearchDebounce = setTimeout(()=>{
            const parsed = parseChordName(chordBuilderState.chordText);
            const def = parsed ? getChordDefinition(parsed) : null;
            if(def){
              chordBuilderState.strings = def.strings.slice();
              chordBuilderState.fingers = (def.fingers||['','','','','','']).slice();
              chordBuilderState.barre = def.barre ? {...def.barre} : null;
              if(def.barre && def.barre.fret > CB_WINDOW_SIZE) chordBuilderState.windowStart = Math.max(1, def.barre.fret - 2);
              renderChordBuilderPartial();
            }
          }, 400);
        });
        cbInput.focus();
      }
    }
    if(state.view==='editChords'){
      focusSheet();
    }
  }

  document.getElementById('app').addEventListener('click', async function(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    if(action==='openSong'){ goView(id, state._lastListIds.slice(), null); }
    else if(action==='editSong'){ e.stopPropagation(); goEditSong(id); }
    else if(action==='goAddChords'){ e.stopPropagation(); goAddChords(id); }
    else if(action==='deleteSong'){ e.stopPropagation(); await deleteSong(id); }
    else if(action==='newSong') goNewSong();
    else if(action==='importPdf'){
      if(!isEditor()) showToast('Você precisa ser um editor aprovado para importar PDFs.');
      else document.getElementById('pdfFileInput').click();
    }
    else if(action==='back') goBack();
    else if(action==='goToChords') goToChords();
    else if(action==='cancelEdit') cancelEdit();
    else if(action==='finishEdit') await finishEdit();
    else if(action==='reeditText') await reeditText();
    else if(action==='toggleScroll'){
      if(state.autoScroll.active) stopAutoScroll(); else startAutoScroll();
    }
    else if(action==='moveLeft') moveCursor(-1);
    else if(action==='moveRight') moveCursor(1);
    else if(action==='addChordHere') openChordPopup();
    else if(action==='removeChordHere') removeChordAtCursor();
    else if(action==='lineUp') changeActiveLine(-1);
    else if(action==='lineDown') changeActiveLine(1);

    else if(action==='goLists') goLists();
    else if(action==='newList'){
      if(!requireConfirmedEmail()) return;
      const name = await showPrompt('Nome da nova lista:', '');
      if(name){
        const list = { id: uid(), name, songIds: [] };
        state.lists.push(list);
        await persistList(list);
        showToast('Lista criada.');
        render();
      }
    }
    else if(action==='openListDetail') goListDetail(id);
    else if(action==='openLikedSongs') goLikedSongs();
    else if(action==='renameList'){
      e.stopPropagation();
      const list = state.lists.find(l=>l.id===id);
      if(!list) return;
      const name = await showPrompt('Novo nome da lista:', list.name);
      if(name){ list.name = name; await persistList(list); render(); }
    }
    else if(action==='deleteList'){
      e.stopPropagation();
      const list = state.lists.find(l=>l.id===id);
      if(!list) return;
      const ok = await showConfirm(`Excluir a lista "${list.name}"? As músicas continuam no acervo.`);
      if(!ok) return;
      state.lists = state.lists.filter(l=>l.id!==id);
      await removeListRemote(id);
      render();
    }
    else if(action==='manageListSongs'){ e.stopPropagation(); openManageListSongsModal(id); }
    else if(action==='openSongInList'){
      const list = state.lists.find(l=>l.id===state.currentListId);
      goView(id, list ? list.songIds.slice() : [], state.currentListId);
    }
    else if(action==='removeFromList'){
      e.stopPropagation();
      const list = state.lists.find(l=>l.id===state.currentListId);
      if(list){
        list.songIds = list.songIds.filter(sid=>sid!==id);
        await persistList(list);
        renderListDetailRows();
        showToast('Removida da lista.');
      }
    }

    else if(action==='toggleCardMenu'){
      e.stopPropagation();
      state.openMenuId = (state.openMenuId===id) ? null : id;
      render();
    }
    else if(action==='openAddToList'){
      e.stopPropagation();
      state.openMenuId = null;
      render();
      openAddToListModal(id);
    }
    else if(action==='openLinks'){
      e.stopPropagation();
      openLinksModal(id);
    }
    else if(action==='toggleFavorite'){
      e.stopPropagation();
      await toggleFavorite(id);
    }
    else if(action==='toggleFavFilter'){
      state.filterFavOnly = !state.filterFavOnly;
      render();
    }
    else if(action==='navPrev'){
      const ctx = state.navContext;
      if(!ctx) return;
      const idx = ctx.indexOf(state.currentId);
      if(idx>0) goView(ctx[idx-1]);
    }
    else if(action==='navNext'){
      const ctx = state.navContext;
      if(!ctx) return;
      const idx = ctx.indexOf(state.currentId);
      if(idx>=0 && idx<ctx.length-1) goView(ctx[idx+1]);
    }
    else if(action==='openReadingControls') openReadingControlsModal();
    else if(action==='transposeUp'){ state.transposeSteps = (state.transposeSteps||0) + 1; render(); }
    else if(action==='transposeDown'){ state.transposeSteps = (state.transposeSteps||0) - 1; render(); }

    else if(action==='signIn') await signIn();
    else if(action==='signUp') await signUp();
    else if(action==='requestReset') await requestPasswordReset();
    else if(action==='submitNewPassword') await submitNewPassword();
    else if(action==='goLogin') goLogin();
    else if(action==='goSignup') goSignup();
    else if(action==='goForgot') goForgot();
    else if(action==='signOut') await signOut();
    else if(action==='resendConfirmation') await resendConfirmationEmail();

    else if(action==='requestEditor') await requestEditorAccess();
    else if(action==='goAdmin') goAdmin();
    else if(action==='openProfileInfo') goProfileInfo();
    else if(action==='goChordLibrary') goChordLibrary();
    else if(action==='setChordFilter'){ state.chordFilter = el.dataset.filter; render(); }
    else if(action==='showChordPopup') showChordPopup(el.dataset.chord);
    else if(action==='goChordBuilder') goChordBuilder(el.dataset.chord, el.dataset.editkey || null);
    else if(action==='deactivateChord') await deactivateChord(el.dataset.dbid);
    else if(action==='cbShiftUp') cbShiftWindow(-1);
    else if(action==='cbShiftDown') cbShiftWindow(1);
    else if(action==='cbToggleMute') cbToggleOpenMute(parseInt(el.dataset.string, 10));
    else if(action==='cbClear') cbClear();
    else if(action==='cbSave') await cbSave();
    else if(action==='saveProfileInfo') await saveProfileInfo();
    else if(action==='adminTabRequests'){ state.adminTab='requests'; render(); }
    else if(action==='adminTabContributions'){ state.adminTab='contributions'; render(); }
    else if(action==='approveEditorRequest') await approveEditorRequest(id, el.dataset.user);
    else if(action==='rejectEditorRequest') await rejectEditorRequest(id);
    else if(action==='approveContribution') await approveContribution(id);
    else if(action==='rejectContribution') await rejectContribution(id);
    else if(action==='viewContribution') openContributionDetailModal(id);
  });

  /* fecha o menu de 3 pontos ao clicar fora dele */
  document.addEventListener('click', function(e){
    if(state.openMenuId && !e.target.closest('.card-menu-wrap')){
      state.openMenuId = null;
      render();
    }
  });

  /* click on a lyric line in the editor to jump the cursor there */
  document.getElementById('app').addEventListener('click', function(e){
    if(state.view!=='editChords') return;
    const row = e.target.closest('.lyrics-row');
    if(!row) return;
    const idx = parseInt(row.dataset.lineIndex,10);
    const rect = row.getBoundingClientRect();
    const chWidth = getChWidth();
    const pos = Math.round((e.clientX - rect.left) / chWidth);
    const ed = state.editor;
    ed.activeLine = idx;
    ed.cursorPos = Math.max(0, Math.min(ed.lines[idx].text.length, pos));
    ed.popupOpen = false;
    renderEditorSheetOnly();
    focusSheet();
  });

  document.addEventListener('keydown', function(e){
    if(state.view!=='editChords') return;
    const active = document.activeElement;
    const inPopup = active && active.id === 'chordPopupInput';
    const inTitleFields = active && (active.id==='titleInline' || active.id==='artistInline');

    if(inPopup){
      if(e.key==='Enter'){ e.preventDefault(); confirmChordPopup(); }
      else if(e.key==='Escape'){ e.preventDefault(); cancelChordPopup(); }
      return;
    }
    if(inTitleFields) return;

    const ed = state.editor;
    if(!ed) return;
    switch(e.key){
      case ' ':
        e.preventDefault(); moveCursor(1); break;
      case 'ArrowRight':
        e.preventDefault(); moveCursor(1); break;
      case 'ArrowLeft':
        e.preventDefault(); moveCursor(-1); break;
      case 'ArrowDown':
        e.preventDefault(); changeActiveLine(1); break;
      case 'ArrowUp':
        e.preventDefault(); changeActiveLine(-1); break;
      case 'Enter':
        e.preventDefault(); openChordPopup(); break;
      case 'Backspace':
        e.preventDefault(); removeChordAtCursor(); break;
    }
  });

  document.getElementById('pdfFileInput').addEventListener('change', function(e){
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if(!files.length) return;
    if(files.length === 1) handlePdfFile(files[0]);
    else handlePdfFilesBatch(files);
  });

  document.getElementById('app').addEventListener('pointerdown', function(e){
    onChordPointerDown(e);
    beginListDrag(e);
    cbGridPointerDown(e);
  });
  document.addEventListener('pointermove', function(e){
    onChordPointerMove(e);
    onListDragMove(e);
    cbGridPointerMove(e);
  });
  document.addEventListener('pointerup', function(e){
    onChordPointerUp(e);
    onListDragEnd(e);
    cbGridPointerUp(e);
  });
  document.addEventListener('pointercancel', function(e){
    onChordPointerUp(e);
    onListDragEnd(e);
    cbGridPointerUp(e);
  });

  // reajusta o tamanho da letra da cifra ao girar a tela ou redimensionar
  let resizeDebounce = null;
  window.addEventListener('resize', function(){
    if(state.view !== 'view') return;
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(fitSheetFontSize, 120);
  });

  /* ================= INIT ================= */
  runChordSystemTests();
  init();
})();
</script>
